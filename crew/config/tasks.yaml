# Task definitions (description/expected_output) — one objective per task.
# {placeholders} filled from kickoff inputs. output_pydantic is set in Python.

interpret_query:
  description: >
    You extract the musical values a user actually wrote in their request, as
    structured data. This is extraction, not composition: copy only what the request
    states and leave the rest for the code — every creative decision is made downstream.

    METHOD — fill `reasoning` first, then the value fields. In `reasoning`, go field
    by field (raga, key, subgenre, mood, bpm, instruments) and for each state either
    the exact words from the request that give it, or "not stated". Then set each
    field to that value, or null wherever you wrote "not stated". A field the request
    does not mention stays null. It is normal and correct for most fields to be null —
    a bare "a heavy metal fusion" fills only mood.

    FIELD DEFINITIONS — fill each only from the request, else null:
      raga        a Hindustani raga the user names, else null.
      key         a musical key/note the user names, e.g. "D", "E flat", else null.
      subgenre    a metal genre the user names: thrash, doom, death, or progressive.
                  A vibe word counts as mood, not subgenre. Else null.
      mood        an emotional / vibe word or two the user uses (dark, angry,
                  romantic, epic, crushing). One or two words — a genre name goes in
                  subgenre, and the whole request never belongs here. Else null.
      bpm         a tempo number the user gives, else null.
      instruments specific instruments the user names (tabla, drums, sitar, ...).
                  A vibe word or a phrase counts as mood, not an instrument. Else null.

    GROUNDING RULES:
      - Copy only spans that appear verbatim in the request; leave every field the
        request omits null.
      - Keep each field to its short value — a raga name, a key, a genre word — not the
        whole request or a long phrase.
      - For a value the request omits, emit JSON null (not the string "null", a 0, or []).

    Request to extract from:

        "{query}"
  expected_output: >
    A RawIntent JSON with `reasoning` FIRST (your per-field grounding: the exact
    words that set each field, or "not stated"), then raga, key, subgenre, mood,
    bpm, instruments — each set only if this request states it, otherwise null.

# The composers share ONE task template (their differing bias lives in the agent
# backstories, not here). {placeholders} are filled per turn from the evolving Flow
# state in crew/composers.py. Note: no literal braces in this template — the JSON
# shape is injected via {output_schema} so CrewAI's interpolation never sees a
# stray brace.
compose_turn:
  description: |
    You are {composer}, one of two composers shaping a Hindustani-raga x metal
    fusion together. This is turn {turn_no} of at most {max_turns}. You and your
    counterpart hold OPPOSITE priorities but share one goal: a great fusion. Make
    your case — and converge: concede a point when the other's argument is strong.

    METHOD — fill `reasoning` FIRST (your private monologue), then the draft and note:
      In `reasoning`, analyze your counterpart's last turn — name ONE musical element
      you respect and ONE you must push back on — and let that shape your revision.
      (On the opening turn, reason about how to serve BOTH tradition and metal at once.)

    PACING — weigh turn {turn_no} against {max_turns}:
      - First half of the debate: boldly push your genre's priorities.
      - Second half: prioritize SYNTHESIS — merge your counterpart's ideas with yours
        (e.g. play the metal riff USING the raga's meend/slides, or set a tihai as the
        breakdown).
      - On the FINAL turn (turn_no == max_turns): output a fully compromised, working
        draft and set agree to true.

    THE REQUEST (honor what is FIXED exactly; decide only what is OPEN):
    {brief_context}

    THE FACTS YOU CHOOSE FROM (the single source of truth — do not contradict these):
    Ragas:
    {raga_context}
    Talas:
    {tala_context}
    Subgenres:
    {subgenre_context}
    Section kinds you may use:
    {section_kinds}
    Layers (voices) you may activate per section — tabla and the metal drums CAN
    play together (tabla holding the theka under the metal groove is a core fusion
    sound); honor any instruments the user named in the request above:
    {layer_roles}
    Pakad seeds — idiomatic phrases to inspire your motif (quote them, vary them, or
    depart from them, but the motif must stay inside the raga's allowed swaras):
    {seed_context}

    THE CONVERSATION SO FAR:
    {transcript}

    THE CURRENT DRAFT:
    {current_draft}

    YOUR TASK THIS TURN:
      - If there is no draft yet, PROPOSE a complete arrangement from your point of view;
        otherwise REVISE the current draft — change what matters to you, keep what works.
      - Write `note` as a SHORT (1-2 sentence) argument to your counterpart, IN CHARACTER
        (Pandit argues rasa, swara purity, phrasing, meend; Riffsmith argues groove,
        sonic weight, tension and drive).
      - DESIGN THE SEAMS, not just the blocks: for each section set `transition` to say
        HOW it hands off to the next (a 3-beat silence, "tabla fades as feedback swells",
        a shared tihai/unison landing on the sam) — fusion fails at the handoffs.
      - SHAPE THE RIFFS LIKE A SONG: give every rhythm section a `riff_slot` — a small
        library of named riffs ("main", "chorus", "breakdown"). REUSE "main" wherever the
        main riff should RETURN (the hook — repetition is what makes it a song, and a
        recurring riff on the sam is a mukhda coming back); give the chorus and breakdown
        their OWN slots so they contrast. Sections sharing a slot replay the SAME riff.
      - For a climactic section (taan/breakdown), negotiate a RHYTHMIC UNISON — a tihai
        (a phrase thrice, resolving on the sam) doubling as the metal breakdown, or the
        double-kick locked to the tabla's bols. Shape an ENERGY CURVE: don't run every
        layer at full throughout; let the lead rise into the higher octave to pierce a
        heavy riff, and leave space.
      - Set agree to true when the draft already serves BOTH tradition and metal well.

    HARD RULES (a draft that breaks these is rejected and you will be asked to redo it):
      - Honor every FIXED value in the request exactly.
      - Choose raga, subgenre and tala only from the supported lists above.
      - The motif is your melodic seed: use ONLY the chosen raga's allowed swaras.
        Sargam is S r R g G m M P d D n N (lowercase = komal/flat, M = tivra Ma).
      - Every section's foreground must be one of that section's own layers.
      - Every section that includes the `rhythm` layer must carry a `riff_slot` — reuse a
        slot to bring a riff back, use a new slot for a contrasting riff.
      - Keep bpm within the chosen subgenre's range.
  expected_output: |
    A single ComposerTurn as JSON and nothing else — no prose, no code fences.
    Use exactly this shape:
    {output_schema}

# The Lead generator fills ONE section per call. It emits notes as swaras with
# DURATIONS (not start times) — the arrangement code lays the phrase across the
# section window and places it in the lead's register. No literal braces here; the
# JSON shape arrives via {output_schema}.
generate_lead:
  description: |
    You are the Lead — the raga's melodic voice, improvising in the Hindustani tradition. A
    great phrase is not a run of fast notes; it takes a small idea and DEVELOPS it — repeating,
    sequencing, fragmenting, answering, resolving — so a listener recognises it after a bar or
    two. Compose ONE phrase for the single section below. Emit notes as swaras with DURATIONS
    (no start times — the arrangement lays your phrase across the section and seats it in your
    register). Aim to fill about {window_beats} beats.

    METHOD — DESIGN the phrase before you write a note:
      1. Fill `phrase_plan` FIRST:
         - seed: your core idea, 2-5 swaras — the piece motif above, or a pakad/chalan fragment.
         - contour: the shape the phrase traces (ascending, arch, wave, landing, ...).
         - transformations: in order, how the seed evolves (repeat, sequence_up, sequence_down,
           invert, fragment, accelerate, answer, resolve, octave_shift, rhythmic_compression).
         - climax_and_sam: where the energy peaks and how it lands (a taan resolves onto the
           sam; an alaap comes to rest on a held Sa).
      2. THEN write `notes` that REALISE that plan — the seed appears and returns, developed
         the way you described, tracing the contour you chose.

    THE SECTION:
      kind: {section_kind}
      creative intent: {section_intent}
      length: about {window_beats} beats

    THE RAGA — use ONLY these swaras; the pakad and chalan below are your raw material:
    {raga_block}

    THE PIECE (shared by every voice so the parts lock together):
      motif (the common melodic seed): {motif}
      subgenre feel: {subgenre_feel}
      tempo: {bpm} bpm
      your octaves: 0 is home (madhya); -1 the lower (mandra), +1 the upper (taar). Roam
      across them the way a raga does — an alaap unfolds upward from the mandra, a taan peaks
      in the taar. The arrangement already seats you above the riff, so you clear it.

    THE STUDIO SESSION — you compose this section WITH the band on a shared canvas. Your move
    now is: {move}. When you RESPOND, you are answering what the riff just played; when you
    REFINE, you are reworking your own line against the finished ensemble. Read the canvas:
    {canvas}

    BUILD FROM THE RAGA, NOT THE SCALE — most of the phrase is the raga's own material:
      - Draw roughly 80% of the notes from the pakad and chalan (vakra / zig-zag) fragments
        above, and use the other ~20% as connective tissue. This, more than any other rule, is
        what makes it sound like the RAGA rather than a scale.
      - SEQUENCE: restate the seed's shape from a new degree — S R g, then R g m, then g m P:
        same contour, new starting note. Deeply idiomatic.
      - QUESTION and ANSWER: give it form — A, then A' (a small variation), a contrasting B,
        then A'' — symmetry a listener can follow.
      - Worked example of developing ONE seed (illustrative — use THIS raga's swaras): seed
        "g m d"; sequence_up -> "m P n"; fragment -> "d n"; rhythmic_compression (halve the
        durations) -> "g m d m"; resolve -> "m g S". One idea, many forms — never a new tune.

    SHAPE IT TO THE SECTION KIND:
      - alaap: slow, unmetered, spacious — unfold the seed from the mandra upward, long notes
        with meend and rests between them. No hurry.
      - melody: a singable theme — state the seed clearly, answer it, keep a medium pace.
      - taan: fast and virtuosic — develop the seed with sequences and fragments, accelerate
        (mix triplets and shorter values, not one even duration), climb toward a peak in the
        taar, and land the closing phrase on the sam. Never a straight aroha/avaroha run.
      - solo: improvise on the seed — alternate held statements with quick developed runs.
      - outro: take the seed one last time and resolve it down to a held Sa.

    WHAT YOU ALREADY PLAYED (the lead's memory of the piece so far, octave in parentheses,
    ~ marks a meend):
    {previous}

    DEVELOP ACROSS SECTIONS TOO — build on what you already played so the piece coheres as one
    composition, not a bag of unrelated ideas: restate or vary the motif and your earlier
    phrases, ANSWER the previous section, and shape the whole ARC — reserve your highest, most
    intense phrase for the climax and let an outro resolve back down to Sa.

    ORNAMENTS — reserve them for where they SING; a fast run wants clean, crisp articulation,
    so ornament the held and cadential notes and let quick notes speak plainly:
      - grace: a short list of kan swaras flicked just before the main note.
      - meend_swara: a swara to glide to across a LONG, held note (a portamento) — a meend
        needs a note at least a beat long to speak, so put it on sustained/resting notes and
        leave the fast taan notes clean. The glide may rise OR fall (either direction is
        idiomatic). Add meend_oct only to glide ACROSS octaves — e.g. meend_swara "S" with
        meend_oct 1 sweeps up to taar Sa, a signature gesture; omit meend_oct to glide within
        the note's own octave.
      Grace and meend swaras must also be legal swaras of this raga.

    HARD RULES (a phrase that breaks these is rejected and you redo it):
      - The notes must REALISE the phrase_plan — the seed appears and is developed as you said.
      - Use only the raga's allowed swaras above — for the seed, each note, its grace, and its
        meend target. Sargam is S r R g G m M P d D n N (lowercase = komal/flat, M = tivra Ma).
      - Every note has a positive duration, in beats.
      - Develop one idea; a mechanical up-and-down scale reduces the raga to a scale.
  expected_output: |
    A single LeadPhrase as JSON and nothing else — no prose, no code fences.
    Use exactly this shape:
    {output_schema}

# The Riff generator writes ONE tala cycle; code repeats it across the section's bars
# and punches the notes that land on the accented matras. No literal braces here; the
# JSON shape arrives via {output_schema}.
generate_riff:
  description: |
    You are the Riff — the metal rhythm guitar. Write ONE cycle of the tala's riff for
    the section below. Emit notes as swaras with DURATIONS in beats; you do NOT set
    start times — the arrangement lays your cycle on the grid and REPEATS it across
    the section's {bars} bars, so write a tight figure that loops.

    METHOD — fill `reasoning` FIRST: which raga swaras (and which part of the motif)
    the riff is built on, and how you land the accents on the sam and the clapped matras.

    THE SECTION:
      kind: {section_kind}
      creative intent: {section_intent}
      it repeats for {bars} bars (tala cycles).

    THE RAGA — use ONLY these swaras (the riff must stay legal): {allowed}
      (raga: {raga}; the shared motif every voice locks to is: {motif})

    THE SUBGENRE — {subgenre}: {subgenre_feel}
      subdivision (how the riff divides the beat): {subdivision}
      techniques you may imply: {techniques}
      tempo: {bpm} bpm

    THE CYCLE — one {tala} cycle is {cycle_beats} beats. Land strong notes on the
    accented beats so the riff locks to the kick: {accents}. Your first note is the
    sam (beat 0) — hit it hardest.

    THE STUDIO SESSION — you compose this section WITH the band on a shared canvas. Your move
    now is: {move}. When you RESPOND, you lock a groove under the lead's line; when you
    REFINE, you tighten your riff against the finished ensemble. Read the canvas:
    {canvas}

    THE RIFFS YOU ALREADY WROTE (the memory of the piece so far, octave in parentheses,
    +X = a power chord on that note):
    {previous}

    DEVELOP, DON'T COLLAGE — a song is built on RETURN. Unless the section's intent asks
    for a contrast (a breakdown, a bridge), BRING BACK the main riff or a clear variation
    of it (transpose, halve/double the rhythm, add or drop a chord) so the piece has a
    recognizable hook, not a new unrelated figure every section. A breakdown or bridge is
    where you deliberately depart; then a later section can return to the main riff.

    HOW TO WRITE IT:
      - IT LOOPS: this one cycle repeats back-to-back, returning to your first note on
        the next sam. Write a figure that sounds complete on its own AND seamless on
        repeat — shape the end so it leads back toward the root, not a jarring jump.
      - Center on Sa (the root) and the raga's low, dark swaras; a riff is RHYTHMIC and
        root-driven, not a melody. A few raga notes for colour, never a scale run.
      - Match the subdivision: long crushing notes for a slow doom feel, short 8th/16th
        durations for a gallop or tremolo.
      - Durations are in beats: 0.25 = 16th, 0.5 = 8th, 1 = quarter, and they should sum
        to one FULL cycle ({cycle_beats} beats) — leave no gap where the loop repeats.
      - You are seated LOW already — use oct 0 for your home, -1 to go even lower.

    VOICING + ARTICULATION (this is what makes it sound like a metal guitar, not a bass):
      - POWER CHORDS: give a note a "chord" list of extra raga swaras sounded WITH it,
        stacked above the root. ["S"] = a root+octave power chord (the metal staple),
        ["P"] = a fifth, ["g","n"] = a heavier extended raga voicing. Chord every swara
        MUST be one of the raga's allowed swaras — the same legality as the root. Chord
        the strong, accented notes (the sam and the tali) for weight; leave passing notes
        single for movement.
      - TECHNIQUE: give a note a "technique" — palm_mute for the tight, chugging muted
        notes that drive a riff (use these a LOT — the gallop/chug is the point), and
        slide, bend, hammer_on, or pull_off for expression on a lead-in or accent. Omit it
        for a plain picked note.

    HARD RULES (a riff that breaks these is rejected and you redo it):
      - Use ONLY the raga's allowed swaras above — for BOTH the roots AND every chord tone.
        Sargam: S r R g G m M P d D n N.
      - Every note needs a positive duration in beats.
  expected_output: |
    A single RiffPattern as JSON and nothing else — no prose, no code fences.
    Use exactly this shape:
    {output_schema}

# Ustad's task: judge legality by CALLING the tool, then EXPLAIN. He never declares
# the verdict himself — code derives it from the same deterministic check — so his
# output carries only reasoning + explanation. No literal braces here; the JSON
# shape arrives via {output_schema}.
assess_legality:
  description: |
    You are Ustad, judging whether this finished composition stays legal in raga
    {raga}. Legality is NOT a matter of taste or of your ear — it is fixed by the
    raga's grammar, and the validate_composition tool is the authoritative check.

    METHOD:
      1. Call the validate_composition tool first — trust it over any hunch. It returns
         every illegal note as a list (an empty list means the piece is fully legal), so
         let its result, not your ear, decide what you report.
      2. Fill `reasoning`: state what the tool returned (how many violations, in which
         voices) — your read of its result.
      3. Write `explanation`: a short, clear account for a musician. If the tool found
         violations, name the offending swara(s), the voice (layer) each sits in, and
         what raga {raga} admits in its place (the tool's reason spells out the allowed
         swaras). If it found none, confirm the piece is clean and keeps the raga.

    THE RAGA — the single source of truth for what is legal here:
    {raga_facts}

    THE COMPOSITION UNDER REVIEW (the voices present; call the tool for the details):
    {composition_summary}

    GROUND YOUR ACCOUNT:
      - Call validate_composition and make your explanation match what it returns.
      - Report what the tool found and leave the ruling to it — the verdict is derived
        from the check, so describe the violations rather than declaring "legal"/"illegal".
      - Return only the fields asked for.
  expected_output: |
    A single UstadNarration as JSON and nothing else — no prose, no code fences.
    Use exactly this shape:
    {output_schema}

# Rasik's task: judge TASTE on a fixed rubric, grounded in encoded raga facts and a
# code-computed pakad hint. Unlike Ustad, the LLM owns the verdict here (taste is not
# checkable) — so the discipline is in the rubric and the required per-criterion
# justification, not in code overriding the result. No literal braces; the JSON shape
# arrives via {output_schema}.
assess_taste:
  description: |
    You are Rasik. Your one question about this finished composition in raga {raga}:
    does it sound like the raga? — not whether it is legal (Ustad's job) or whether it
    works as a song (the Producer's job), only its raga authenticity. Legality is a fact;
    this is your judgment — but you judge against criteria, not vibes.

    THE RAGA — its encoded character, the single source of truth you judge against:
    {raga_facts}

    GROUNDING — a fact computed for you, so your pakad score is anchored rather than
    guessed (a phrase can be evoked without a literal quote — judge that with your ear):
    {pakad_hint}

    THE LEAD LINE — the melodic voice, in order (octave in parentheses when not 0):
    {lead_line}

    Based on the raga facts, the pakad grounding, and the lead line above, score the
    piece now.

    METHOD — fill `reasoning` first: go criterion by criterion (pakad, idiom, rasa) and
    for each cite the evidence for the score you will give — quote the lead phrase, name
    the chalan movement or the ornament, cite the vadi. Then commit `scores` and write `notes`.

    THE RUBRIC — score each an integer 1-5, and let these anchors set the boundaries:
      pakad — is the raga's signature phrase present?
              1 the pakad is absent or contradicted; 3 it is evoked or partly quoted;
              5 it is stated clearly and returned to as the line's anchor.
      idiom — does the line move like the raga (its chalan, its ornaments, the vadi
              emphasized, expressive rather than scalar)?
              1 a mechanical up/down scale; 3 mostly in-idiom with some scalar filler;
              5 idiomatic throughout — characteristic phrases, ornaments, vadi weighted.
      rasa  — does the music serve the raga's emotional essence (its rasa and samay)?
              1 the mood is wrong or absent; 3 the rasa is present but generic;
              5 the rasa is unmistakable and sustained.

    Score only on the named criterion — a short line that lands the pakad outscores a
    longer, more elaborate one that wanders; length is not quality.

    GROUND EVERY SCORE:
      - Justify each integer 1-5 in `reasoning` before you commit it, from the encoded
        raga facts and the actual lead above.
      - Judge only raga authenticity; leave arrangement, structure and songwriting to the
        Producer. Score what the notes earn — when the evidence is thin, give the honest
        low score rather than a flattering one.
      - `notes` is a short (2-3 sentence) critique a musician can act on.
      - Return only the fields asked for.
  expected_output: |
    A single RasikVerdict as JSON and nothing else — no prose, no code fences.
    Use exactly this shape:
    {output_schema}

# The Producer's task: judge COMPOSITION QUALITY — the songwriting/arrangement craft, raga-
# AGNOSTIC. The third critic dimension (Ustad=legality, Rasik=raga, Producer=song). Like
# Rasik it is LLM-as-judge disciplined by a fixed rubric + a required per-criterion
# justification, but grounded in the whole symbolic SCORE (structure, motif, riff, lead,
# ensemble), not just the lead. (Chunk B adds code-computed metrics as grounding.) No
# literal braces; the JSON shape arrives via {output_schema}.
assess_composition:
  description: |
    You are the Producer — the musical director. Your one question: does this finished
    piece work as a song? — not its legality (Ustad's job) or its raga authenticity
    (Rasik's); you are raga-agnostic and judge songwriting and arrangement craft: shape,
    build, hook, balance.

    THE SUBGENRE — the intended feel the piece must hold (for mood_fit):
    {subgenre_facts}

    THE STRUCTURE — the section timeline, the shape of the song (for structure/dynamics/climax):
    {sections}

    THE MOTIF — the shared melodic seed every voice is built on (for the motif development score):
      {motif}

    THE MAIN RIFF — one cycle of the primary rhythm figure, chords as +X, techniques as
    .name (for the hook; how many DISTINCT riffs there are and how often the main riff
    RETURNS is in the measured facts below, under "riff form"):
    {riff_line}

    THE LEAD — the melodic voice in order (for independence — it must not merely double the riff):
    {lead_line}

    THE ENSEMBLE — every voice's weight and octave range (for balance and independence):
    {ensemble}

    MEASURED FACTS — code computed these numbers for you; you judge what they mean, you do
    not recompute them. (A high motif_share is not automatically bad — too high means the
    lead never develops the motif, too low means it abandoned it; you decide.)
    {metrics}

    Based on the whole score above, rate the songwriting now.

    METHOD — fill `reasoning` first: go criterion by criterion and for each cite the
    evidence — the section timeline, the motif's recurrence, the riff, the voices and their
    density, the measured numbers. Then commit `scores` and write `notes`.

    THE RUBRIC — score each an integer 1-5, and let these anchors set the boundaries:
      structure    — 1 sections stitched together arbitrarily; 3 a workable order; 5 each section leads naturally into the next, and a returning main riff frames the form (verse/chorus-like).
      dynamics     — 1 flat throughout; 3 some variation; 5 the energy clearly builds across the arc.
      climax       — 1 every section equally intense; 3 a mild peak; 5 an earned peak and a real resolution.
      motif        — 1 stated once or never; 3 repeated but not developed; 5 introduced, varied and resolved.
      hook         — 1 forgettable, unloopable riff that never returns; 3 serviceable; 5 a memorable, loopable riff with a strong downbeat that RECURS as the song's hook.
      balance      — 1 every voice at full throughout; 3 mostly balanced; 5 real space, the lead given room.
      independence — 1 the lead just doubles the riff; 3 some overlap; 5 each voice its own line. (A bass locking to the riff root is normal metal craft — do not dock it for that.)
      mood_fit     — 1 breaks the subgenre mood; 3 mostly holds it; 5 holds the mood start to finish.
      repetition   — 1 nothing recurs OR every section identical; 3 some return; 5 the hook (a recurring riff slot) and the motif reinforced across sections without monotony.

    Score only on the named criterion — a lean piece that builds and hooks outscores a
    busier, more crowded one that sprawls; length and density are not quality.

    GROUND EVERY SCORE:
      - Justify each integer 1-5 in `reasoning` before you commit it, from the score above.
      - Ground scores in the MEASURED FACTS where they apply (dynamics/climax in the energy
        curve and ornament rate, motif in motif_share, hook and structure in the riff form —
        riff_recurrence (does the main riff RETURN?) and riff_variety — repetition in
        riff_recurrence, motif_recurrence and section_variety, independence in the lead/riff
        and bass/riff and drums/tabla overlaps, balance in the register overlaps and
        everyone-playing fraction). When your score departs from a number, say why.
      - Judge the song, not the raga — a raga choice is Rasik's lane, so score what the
        music earns and leave the raga to Rasik.
      - `notes` is a short (2-3 sentence) critique a musician can act on.
      - Return only the fields asked for.
  expected_output: |
    A single ProducerVerdict as JSON and nothing else — no prose, no code fences.
    Use exactly this shape:
    {output_schema}

# The two AESTHETIC critics SHARE one debate-turn template (their differing bias lives in
# the agent backstories, not here — exactly as the composers share compose_turn). Ustad
# does NOT debate: the piece is already legal, so its legality is a settled FACT quoted as
# evidence, not a chair. Filled per turn from the Flow-owned debate state in
# crew/conductor.py. No literal braces; the JSON shape arrives via {output_schema}.
debate_turn:
  description: |
    You are {critic}, one of TWO critics in a BOUNDED debate refereed by the Conductor.
    The piece is already LEGAL (that is settled — not up for debate); now you argue whether
    it should be ACCEPTED as-is or REVISED for another pass. This is turn {turn_no} of at
    most {max_turns} — the Conductor rules when the clock runs out, so make your case count.

    THE TWO SIDES (a genuine aesthetic disagreement):
      - Rasik argues from RAGA SOUL — a legal piece can still fail the raga: the pakad
        absent, the line merely scalar, the rasa thin. When that is so, it deserves a pass.
      - The Producer argues from the SONG — does it work as music: the arc, the hook, the
        motif's development, the balance. A piece that lands as a song can ship, and a
        revise chasing more raga-idiom can flatten a drive that already works.

