# Task definitions (description/expected_output) — one objective per task.
# {placeholders} filled from kickoff inputs. output_pydantic is set in Python.

interpret_query:
  description: >
    You extract the musical values a user actually wrote in their request, as
    structured data. This is extraction, not composition: copy only what the request
    states and leave the rest for the code — every creative decision is made downstream.

    METHOD — fill `reasoning` first, then the value fields. In `reasoning`, go field
    by field (raga, key, subgenre, mood, bpm, tala, laya, instruments) and for each
    state either the exact words from the request that give it, or "not stated". Then
    set each field to that value, or null wherever you wrote "not stated". A field the
    request does not mention stays null. It is normal and correct for most fields to be
    null — a bare "a heavy metal fusion" fills only mood.

    FIELD DEFINITIONS — fill each only from the request, else null:
      raga        a Hindustani raga the user names, else null.
      key         a musical key/note the user names, e.g. "D", "E flat", else null.
      subgenre    a metal genre the user names: thrash, doom, death, progressive,
                  black, melodic death, heavy, or symphonic. A vibe word counts as mood,
                  not subgenre. Else null.
      mood        an emotional / vibe word or two the user uses (dark, angry,
                  romantic, epic, crushing). One or two words — a genre name goes in
                  subgenre, and the whole request never belongs here. Else null.
      bpm         a tempo NUMBER the user gives (e.g. "120 bpm"), else null. A tempo WORD
                  like "vilambit" or "slow" is NOT a bpm — it goes in laya.
      tala        a Hindustani rhythmic cycle the user names: teentaal, jhaptaal, ektaal,
                  rupak, keherwa, or dadra. Copy just the tala name even if the request wraps
                  it ("in vilambit teentaal" -> tala "teentaal", laya "vilambit"). Else null.
      laya        a tempo CLASS the user names: vilambit (slow), madhya (medium), or drut
                  (fast) — or its English gloss (slow / medium / fast). Else null.
      instruments specific instruments the user names (tabla, drums, sitar, ...).
                  A vibe word or a phrase counts as mood, not an instrument. Else null.

    GROUNDING RULES:
      - Copy only spans that appear verbatim in the request; leave every field the
        request omits null.
      - Keep each field to its short value — a raga name, a key, a genre word — not the
        whole request or a long phrase.
      - For a value the request omits, emit JSON null (not the string "null", a 0, or []).

    Request to extract from:

        "{query}"
  expected_output: >
    A RawIntent JSON with `reasoning` FIRST (your per-field grounding: the exact
    words that set each field, or "not stated"), then raga, key, subgenre, mood,
    bpm, tala, laya, instruments — each set only if this request states it, otherwise null.

# The composers share ONE task template (their differing bias lives in the agent
# backstories, not here). {placeholders} are filled per turn from the evolving Flow
# state in crew/composers.py. Note: no literal braces in this template — the JSON
# shape is injected via {output_schema} so CrewAI's interpolation never sees a
# stray brace.
compose_turn:
  description: |
    You are {composer}, one of two composers shaping a Hindustani-raga x metal
    fusion together. This is turn {turn_no} of at most {max_turns}. You and your
    counterpart hold OPPOSITE priorities but share one goal: a great fusion. Make
    your case — and converge: concede a point when the other's argument is strong.

    METHOD — fill `reasoning` FIRST (your private monologue), then the draft and note:
      In `reasoning`, analyze your counterpart's last turn — name ONE musical element
      you respect and ONE you must push back on — and let that shape your revision.
      (On the opening turn, reason about how to serve BOTH tradition and metal at once.)

    PACING — weigh turn {turn_no} against {max_turns}:
      - First half of the debate: boldly push your genre's priorities.
      - Second half: prioritize SYNTHESIS — merge your counterpart's ideas with yours
        (e.g. play the metal riff USING the raga's meend/slides, or set a tihai as the
        breakdown).
      - On the FINAL turn (turn_no == max_turns): output a fully compromised, working
        draft and set agree to true.

    THE REQUEST (honor what is FIXED exactly; decide only what is OPEN):
    {brief_context}

    THE FACTS YOU CHOOSE FROM (the single source of truth — do not contradict these):
    Ragas:
    {raga_context}
    Talas:
    {tala_context}
    Subgenres:
    {subgenre_context}
    Section kinds you may use (how a block is RENDERED):
    {section_kinds}
    Form roles — the GAT FORM (what each section DOES); set `form_role` on EVERY section,
    orthogonal to its kind:
    {form_roles}
    Layers (voices) you may activate per section — tabla and the metal drums CAN
    play together (tabla holding the theka under the metal groove is a core fusion
    sound); honor any instruments the user named in the request above. Give the
    taan_long section the TABLA: its final avartan drops the metal band out (a coded
    exposure — the sitar flies alone), and the theka is what carries the tala through
    that naked cycle into the re-entry sam:
    {layer_roles}
    Pakad seeds — idiomatic phrases to inspire your motif (quote them, vary them, or
    depart from them, but the motif must stay inside the raga's allowed swaras):
    {seed_context}

    THE CONVERSATION SO FAR:
    {transcript}

    THE CURRENT DRAFT:
    {current_draft}

    YOUR TASK THIS TURN:
      - If there is no draft yet, PROPOSE a complete arrangement from your point of view;
        otherwise REVISE the current draft — change what matters to you, keep what works.
      - GAT IS THE FORM: build the piece as a gat, in tala cycles — an intro/alaap, then a
        MUKHADA (the recurring melodic + rhythmic head that resolves to the sam), develop it
        through a manjha and a higher-register antara, RETURN the mukhada as the hook, reserve
        ONE long taan/solo for the peak (after the antara or before the final mukhada), and
        settle in an outro. Set `form_role` on EVERY section to name its place in this form;
        the mukhada must appear at least twice (stated, then returned as the hook).
      - DECLARE THE ANCHOR (`anchor`): ONE idea seeds the whole piece — gat_first (the sitar
        mukhada is the source; the main riff is a rhythmic REDUCTION of it) or riff_first (the
        riff is the source; the mukhada QUOTES the riff's accented notes). Do not invent two
        unrelated ideas — the riff and the gat are two faces of one anchor.
      - Write `note` as a SHORT (1-2 sentence) argument to your counterpart, IN CHARACTER
        (Pandit argues rasa, swara purity, phrasing, meend; Riffsmith argues groove,
        sonic weight, tension and drive).
      - DIRECT THE PLAYERS, don't just lay out blocks: give EVERY section an `intent` — one
        line of MUSICAL direction (what the section should feel and do: motif treatment,
        register, texture, how sitar and riff interact), not a restatement of its kind. The
        generators read it verbatim; an empty intent wastes your only channel to them.
      - DESIGN THE SEAMS, not just the blocks: for each section set `transition` to say
        HOW it hands off to the next (a 3-beat silence, "tabla fades as feedback swells",
        a shared tihai/unison landing on the sam) — fusion fails at the handoffs.
      - SHAPE THE RIFFS LIKE A SONG: give every rhythm section a `riff_slot` — a small
        library of named riffs ("main", "chorus", "breakdown"). REUSE "main" wherever the
        main riff should RETURN (the hook — repetition is what makes it a song, and a
        recurring riff on the sam is a mukhda coming back); give the chorus and breakdown
        their OWN slots so they contrast. Sections sharing a slot replay the SAME riff.
      - DECIDE THE HARMONY per section (`harmony`) — how the music moves UNDER the melody:
        "drone" (no motion — the tanpura dyad; the alap and the taan climax), "modal_pedal"
        (the raga-metal DEFAULT — a Sa pedal under CHANGING colour tones; set `roots` to the
        colour swaras or leave them empty for the vadi/samvadi), or "progression" (a short
        per-avartan chord-root cycle, for a CHORUS-like section only: 2-4 raga swaras with
        the LAST one S, so the cycle comes home — this music's gravity is melodic, and a
        cycle that ends away from Sa is rejected). Activate the `clean` layer wherever the
        harmony should be HEARD as arpeggios — an intro shimmer, colour under a melody, a
        breakdown afterglow.
      - For a climactic section (taan/breakdown), negotiate a RHYTHMIC UNISON — a tihai
        (a phrase thrice, resolving on the sam) doubling as the metal breakdown, or the
        double-kick locked to the tabla's bols. Shape an ENERGY CURVE: don't run every
        layer at full throughout; let the lead rise into the higher octave to pierce a
        heavy riff, and leave space.
      - Set agree to true when the draft already serves BOTH tradition and metal well.

    HARD RULES (a draft that breaks these is rejected and you will be asked to redo it):
      - Honor every FIXED value in the request exactly.
      - Choose raga, subgenre and tala only from the supported lists above.
      - The motif is your melodic seed: use ONLY the chosen raga's allowed swaras.
        Sargam is S r R g G m M P d D n N (lowercase = komal/flat, M = tivra Ma).
      - Every section's foreground must be one of that section's own layers.
      - Every section that includes the `rhythm` layer must carry a `riff_slot` — reuse a
        slot to bring a riff back, use a new slot for a contrasting riff.
      - Every section must carry a `form_role`; a MUKHADA must be STATED and RETURN (mark at
        least two sections 'mukhada'); at most ONE section may be 'taan_long'.
      - Keep bpm within the chosen subgenre's range.

    BEFORE YOU FINALIZE — run this CHECKLIST over your own draft (each miss is a rejected
    turn and a redo, so verify first):
      [ ] every FIXED value honored; raga/subgenre/tala from the supported lists
      [ ] motif uses ONLY the raga's allowed swaras
      [ ] every section: form_role set, foreground is one of its own layers
      [ ] every section: a one-line musical `intent` and a `transition` into the next
      [ ] every rhythm section carries a riff_slot (reuse = the hook returns)
      [ ] 'mukhada' on at least TWO sections (stated + returned); at most ONE 'taan_long'
      [ ] the intro/alap has at least 3 avartans (bars)
      [ ] every manjha sits AFTER a mukhada and is IMMEDIATELY followed by one, and that
          returning mukhada has at least 2 bars
      [ ] the taan_long section includes the TABLA (its final avartan drops the metal band
          — the theka carries that naked cycle)
      [ ] harmony roots are raga swaras; any progression has 2-4 roots ENDING ON S, sits on
          a chorus-like section (never intro/taan_long/outro), and roots avoid the raga's
          descent-only swaras
      [ ] bpm within the subgenre's range
  expected_output: |
    A single ComposerTurn as JSON and nothing else — no prose, no code fences.
    Use exactly this shape:
    {output_schema}

# The Lead generator fills ONE section per call. It emits notes as swaras with
# DURATIONS (not start times) — the arrangement code lays the phrase across the
# section window and places it in the lead's register. No literal braces here; the
# JSON shape arrives via {output_schema}.
# generate_lead is ORDERED FOR THE CACHE + THE MODEL (2026-07-16 latency campaign):
# the static rulebook comes FIRST (an identical prefix across every lead call, so Gemini's
# implicit caching can hit), the ONE relevant role brief rides {role_brief} (code picks it —
# the old prompt taught every gat role on every call), the per-section data comes LAST, and
# the final line asks for the composition AFTER the data (Gemini long-context guidance).
generate_lead:
  description: |
    You are the Lead — the raga's melodic voice, improvising in the Hindustani tradition. A
    great phrase is not a run of fast notes; it takes a small idea and DEVELOPS it —
    repeating, sequencing, fragmenting, answering, resolving — so a listener recognises it
    after a bar or two. Compose ONE phrase for the single section described at the end. Emit
    notes as swaras with DURATIONS (no start times — the arrangement lays your phrase across
    the section and seats it in your register).

    METHOD: fill `phrase_plan` FIRST — the schema below explains each field — THEN write
    `notes` that REALISE that plan: the seed appears and returns, developed the way you
    described, tracing the contour you chose.

    BUILD FROM THE RAGA, NOT THE SCALE — most of the phrase is the raga's own material:
      - The phrase OPENINGS, the RESOLUTIONS and every phrase boundary are built from the
        pakad and chalan (vakra / zig-zag) fragments below — that is where a listener hears
        which raga this is. Connective passages may move more freely inside the grammar.
        This, more than any other rule, is what makes it sound like the RAGA rather than a
        scale; a line that merely paraphrases the pakad end to end is the opposite failure.
      - OPEN with a RECOGNISABLE pakad/chalan fragment before you develop it, and return to
        one at the cadence — the signature phrase should be heard often, not buried.
      - DEVELOP the seed the way this music does: repeat it, FRAGMENT it, answer it, compress
        or stretch it rhythmically (layakari), move it to another octave, or shift where it
        comes to rest (nyas) — these are the raga's own devices and always safe.
      - SEQUENCE — restating the shape from a new degree — only where the chalan actually
        supports that move. Marching one contour up through successive degrees is a Western
        device: it can be perfectly legal and still erase the raga, especially in a vakra
        raga whose zig-zag IS its identity. When in doubt, develop rhythmically instead.
      - QUESTION and ANSWER: give it form — A, then A' (a small variation), a contrasting B,
        then A'' — symmetry a listener can follow.
      - Worked example of developing ONE seed (illustrative — use THIS raga's swaras): seed
        "g m d"; sequence_up -> "m P n"; fragment -> "d n"; rhythmic_compression (halve the
        durations) -> "g m d m"; resolve -> "m g S". One idea, many forms — never a new tune.
      - DEVELOP ACROSS SECTIONS TOO: restate or vary the motif and your earlier phrases (your
        memory of the piece is below), ANSWER the previous section, and shape the whole arc —
        reserve the highest intensity for the climax.

    NYAS AND SPACE — a gat BREATHES; neither a pause after every note nor every beat filled:
      - LAND THE SAM: matra 1 of each cycle is the resting point — arrive on a strong note
        (the vadi, Sa, or a m->S resolution) and let it RING or REST there (a nyas).
      - Use 1-2 true RESTS per avartan (set "rest": true) for real silence — the space the
        tabla and the gat share; rest on the raga's resting notes (Sa / Ma / Pa where the
        raga has them).
      - FAST RUNS ARE SIXTEENTHS, EARNED: an eighth-note pickup, then a burst of sixteenths
        (dur 0.25), then a held or resolving note — the speed lands rather than blurs.

    ORNAMENTS AND STROKES — reserve them for where they SING; fast notes speak plainly:
      - grace: a short list of kan swaras flicked just before the main note.
      - meend_swara: a glide INTO a held note (at least a beat long) — the schema explains
        the mechanics; put it on sustained/resting notes and leave fast notes clean. Grace
        and meend swaras must be legal swaras of this raga.
      - bol (the sitar's mizrab stroke — articulation on top; the rhythm is your durations):
        mix "da" (strong) and "ra" (softer); "diri" for pairs and "darada" for triplets in
        fast runs; "chikari" sparingly, to punctuate a phrase-end or answer the tabla. Give
        the mukhada a short recurring bol signature and restate it on every return; vary
        other cells by bol-bant (redistribute the bols, keep the melodic DNA).
      - ornament ("murki" delicate / "khatka" sharper): ONLY if the raga facts below list
        them (most ragas do NOT — the grave, meend-driven ragas use andolan/meend instead).
        Place on a HELD note (~half a beat+), favour the raga's komal swaras, a couple per
        phrase at most; code builds the cluster from the raga's own neighbours.

    HARD RULES (a phrase that breaks these is rejected and you redo it):
      - The notes must REALISE the phrase_plan — the seed appears and is developed as you said.
      - Use only the raga's allowed swaras below — for the seed, each note, its grace, and its
        meend target. Sargam is S r R g G m M P d D n N (lowercase = komal/flat, M = tivra Ma).
      - Every note has a positive duration, in beats.
      - Develop one idea; a mechanical up-and-down scale reduces the raga to a scale.

    YOUR SECTION'S JOB in the whole composition:
    {role_brief}

    THE STROKE FRAME — the gat's bol identity (applies when your section is the head):
    {bol_frame}

    THE RAGA — use ONLY these swaras; the pakad and chalan below are your raw material:
    {raga_block}

    THE PIECE (shared by every voice so the parts lock together):
      motif (the common melodic seed): {motif}
      subgenre feel: {subgenre_feel}
      tempo: {bpm} bpm
      your octaves: 0 is home (madhya); -1 the lower (mandra), +1 the upper (taar). Roam
      across them the way a raga does — the arrangement already seats you above the riff.

    THE SECTION:
      kind: {section_kind}   gat role: {form_role}
      creative intent: {section_intent}
      the SEAM into the next section (the composers designed this handoff — shape your
      final notes to serve it): {section_transition}
      length: compose WITHIN about {window_beats} beats. Do not fill time merely because it
      is there — a held note and a deliberate silence are part of the phrase, not a gap in it.

    TALA POSITION — LAND ON THE SAM: {tala_position}

    THE GAT HEAD YOU ORBIT — the intro TEASES it; the manjha and any taan fill must flow back
    INTO it:
    {mukhada_head}

    WHAT YOU ALREADY PLAYED (the lead's memory of the piece so far, octave in parentheses,
    ~ marks a meend):
    {previous}

    THE STUDIO SESSION — you compose this section WITH the band on a shared canvas. Your move
    now is: {move}. When you RESPOND, you are answering what the riff just played; when you
    REFINE, you are reworking your own line against the finished ensemble. Read the canvas:
    {canvas}

    GAT STRUCTURE CHECK (verified cells — mukhada / intro / manjha / taan fill):
    {repair}

    Based on everything above, compose this ONE section now — the phrase_plan first, then
    the notes that realise it.
  expected_output: |
    A single LeadPhrase as JSON and nothing else — no prose, no code fences.
    Use exactly this shape:
    {output_schema}

# The WHOLE-GAT task: compose mukhada + manjha + antara as ONE object so they share a motif and a
# planned register arc (Parikh's mukhada->manjha->antara). Braces live only in {gat_output_schema}.
generate_gat:
  description: |
    You are the gat composer for a Hindustani-raga x metal fusion. Compose the WHOLE gat as ONE
    coherent composition — the mukhada, manjha, antara and amad TOGETHER — sharing one motif and a
    deliberate REGISTER ARC (Pandit Arvind Parikh's four-line model, spanning 2.5-3 octaves). A gat
    is not separate tunes; it is one identity revealed across the registers, exactly as a musician
    conceives it.

    THE RAGA (the single source of truth — every swara you write, in every part, must be legal here):
    {raga_block}

    THE MOTIF (your seed — quote/derive the mukhada from it and the raga's pakad): {motif}
    Metal feel: {subgenre_feel}    Tempo: {bpm} bpm    Tala: {tala}    One avartan = {cycle_beats} beats.

    THE STROKE FRAME — the mukhada's rhythmic identity (bols are strokes, not pitches):
    {bol_frame}

    ONE ANCHOR FIRST: write a short `anchor` naming the single idea that seeds all the parts (a
    pakad phrase, a rhythmic cell, a register plan), then compose the parts as faces of it.

    THE PARTS — compose EXACTLY these and no others: {parts_needed}
      - mukhada: the GAT HEAD — a compact, memorable ~one-avartan hook in the MADHYA (home) octave,
        built ON THE PAKAD. Its FIRST note sounds ON the sam every avartan: make it Sa or the vadi,
        struck "da". Land the LAST note on a resting swara, written to lead back into the FIRST (it
        loops), and make the final ~5 matras a driving APPROACH into the next sam. Follow the
        stroke frame above — sam struck "da", the dir doublings in place, most notes carrying a
        bol. This is the identity the other parts develop; pour everything in.
      - manjha: the LOWER-REGISTER BRIDGE (Parikh — the manjha takes the melody DOWN into the
        mandra). SHORT (about one avartan), CALM: ONE spacious idea, longer nyas and meend, NOT a
        busy run. Keep the centre of gravity in the mandra / lower-madhya and do NOT climb into the
        taar (the antara owns the upper octave). Contrast the mukhada by register and contour (dip
        down, settle), stay unmistakably in the raga, and lead your final notes stepwise back into
        the mukhada's first swara.
      - antara: the SECOND MOVEMENT — the SAME gat lifted into the TAAR (upper) octave. Open in the
        madhya QUOTING the mukhada's opening swaras, climb, reach ONE peak past the midpoint, then
        begin the descent. When an amad is also asked for, the amad owns the final homecoming — you
        need not come all the way down yourself. Never a new tune — the mukhada's DNA, higher.
      - amad: the COMPOSED DESCENT (Parikh's fourth line — it "brings you down to the point where
        the composition started"). ONE avartan: open on or near the antara's landing swara, come
        down through the madhya without ever climbing above your opening, and end at or below home
        as a stepwise lead-in to the mukhada's first swara — the head re-enters the moment you land.

    Fill each part's `phrase_plan` FIRST, then its `notes`. Return ONE Gat JSON:
    {gat_output_schema}

    HARD RULES (a gat that breaks these is rejected and you redo it):
      - Use ONLY the raga's allowed swaras — every part, every note, each grace and meend target.
      - The parts SHARE the anchor/motif — one composition, not unrelated tunes.
      - Register arc: mukhada madhya; manjha centred in the mandra (NO taar); antara reaches the
        taar; amad descends home.
      - Compose ONLY the parts listed in {parts_needed} (omit the others from the JSON).
  expected_output: |
    A single Gat JSON object: an `anchor` string, `mukhada` always, and `manjha`/`antara`/`amad`
    only when listed in parts_needed — each a phrase_plan + notes using ONLY the raga's legal swaras.

# The Riff generator writes ONE tala cycle; code repeats it across the section's bars
# and punches the notes that land on the accented matras. No literal braces here; the
# JSON shape arrives via {output_schema}.
generate_riff:
  description: |
    You are the Riff — the metal RHYTHM-GUITAR ARRANGER. You do not merely choose notes:
    you decide where to CHUG, where a chord RINGS, where to move, and where to leave
    SILENCE. Heaviness lives in articulation, rhythm, dynamics and space — the raga only
    constrains which pitches you may touch. Write ONE cycle of the tala's riff for the
    section below. Emit notes as swaras with DURATIONS in beats; you do NOT set start
    times — the arrangement lays your cycle on the grid and REPEATS it across the
    section's {bars} bars, so write a tight figure that loops.

    METHOD — fill `reasoning` FIRST: name your GROUND (the one low pitch you chug on and
    keep returning to), which pakad fragment supplies the movement, where the cycle
    breathes (the rests), and how you land the accents on the sam and the clapped matras.

    THE SECTION:
      kind: {section_kind}
      gat role: {form_role}
      creative intent: {section_intent}
      the SEAM into the next section (the composers designed this handoff — let your last
      cycle's ending serve it): {section_transition}
      it repeats for {bars} bars (tala cycles).

    THE TEXTURE MODE — {riff_mode}: how this section's guitar behaves (a deterministic
    verifier enforces these budgets and sends a miss back to you with the exact failure):
      {mode_brief}

    THE RAGA — use ONLY these swaras (the riff must stay legal): {allowed}
      (raga: {raga}; the shared motif every voice locks to is: {motif})
      direction rule: {direction_rule}
      pakad (the raga's SIGNATURE phrase): {pakad}
      chalan (how the raga MOVES): {chalan}
      BUILD THE RIFF FROM THESE, not arbitrary in-scale notes: anchor your chugs on the pakad's
      strong swaras and let its shape/movement pick your pitches — a metal riff that quotes the
      raga's own phrase sounds like the RAGA, not just its scale. Keep it rhythmic and root-driven;
      you are drawing PITCH MATERIAL from the pakad/chalan, not playing them as a melody.

    THE SUBGENRE — {subgenre}: {subgenre_feel}
      subdivision (how the riff divides the beat): {subdivision}
      OPERATIONAL BRIEF — what to actually PLAY (not a mood): {groove_brief}
      techniques you may imply: {techniques}
      tempo: {bpm} bpm

    THE CYCLE — one {tala} cycle is {cycle_beats} beats. Land strong notes on the
    accented beats so the riff locks to the kick: {accents}. Your first note is the
    sam (beat 0) — hit it hardest.

    THE STUDIO SESSION — you compose this section WITH the band on a shared canvas. Your move
    now is: {move}. When you RESPOND, you lock a groove under the lead's line; when you
    REFINE, you tighten your riff against the finished ensemble. Read the canvas:
    {canvas}

    THE SITAR'S GAT HEAD — when this is a mukhada section, your riff REDUCES it:
    {mukhada_line}

    THE RIFFS YOU ALREADY WROTE (the memory of the piece so far, octave in parentheses,
    +X = a power chord on that note):
    {previous}

    DEVELOP, DON'T COLLAGE — a song is built on RETURN. Unless the section's intent asks
    for a contrast (a breakdown, a bridge), BRING BACK the main riff or a clear variation
    of it (transpose, halve/double the rhythm, add or drop a chord) so the piece has a
    recognizable hook, not a new unrelated figure every section. A breakdown or bridge is
    where you deliberately depart; then a later section can return to the main riff.

    SHAPE IT TO ITS GAT ROLE ({form_role}) — the riff's job in the composition:
      - mukhada: the main low-string HOOK — palm-muted chugs on Sa and the raga's dark low
        swaras, a small gallop cell, and enough SPACE (rests) for the gat/sitar to speak.
      - manjha: SIMPLER than the mukhada — the gat's low, calm bridge; settle onto ringing
        chordal support (keep the riff's DNA in the chord roots) and leave the space to the
        lead's quiet low line.
      - antara: lift the register and OPEN up — wider power chords, less palm-muting, ringing.
      - breakdown: simplify to heavy, sparse, tala-aligned power-chord hits (a tihai-cell feel).
      - taan_short / taan_long: thin out and hold back — the melodic taan leads; hold long
        ringing chords under it (a resonant platform, not a pulse).
      - intro / outro / tihai: sparse — set up or settle; a tihai is a figure stated thrice to the sam.

    GROUND AND MOVEMENT (this is what makes a riff instead of a melody) — almost every
    metal riff ALTERNATES two roles; write both, and know which each note is:
      - GROUND: repeated palm-muted strokes on ONE low pitch (usually Sa). This is the
        default texture — after every figure, COME BACK to it. A Lamb of God riff can sit
        on one note; the groove carries it.
      - MOVEMENT: a short 2-4 note figure from the pakad (a gallop long–short–short
        0.5 0.25 0.25, a 3-3-2 grouping 0.75 0.75 0.5, a hammer-on answer) — then back
        to the ground. Movement is earned, never continuous.
      - ATTACK vs RESONANCE: follow a chug run with silence or a ringing chord before the
        next gesture — that alternation IS the heaviness.
      - RESTS: at least one intentional rest per cycle — the gap is where the tabla and
        gat answer.
      - TURNAROUND: end the cycle leading back to the sam (a short 16th run or a slide
        into the root).
      - THE TEST: strip every pitch away — if the bare rhythm is not interesting on its
        own, rewrite the cycle before touching the pitches.

    TECHNIQUE BUDGET — techniques serve a FUNCTION; do not decorate every note:
      - palm_mute is the CHUG texture — write it on the SHORT ground strokes (a 16th, an 8th,
        a quarter at most). The muting hand damps the string, so a chug sounds for roughly
        two-thirds of its written slot and then dies: that decay IS the chug, and it means a
        palm-muted note can never carry a sustain however long you write it.
      - AN OPEN NOTE RINGS UNTIL THE NEXT ATTACK — its written duration is its RING, and the
        next strike is what cuts it. So give a chord the duration you want to HEAR it for: a
        power chord written for 4 beats sustains through all four, holding a resonant floor
        under the sitar. Any chord or note of a beat or more is struck OPEN (no technique).
      - SILENCE IS COMPOSED, never a side effect: write a rest where you want the band to
        breathe. Space that you did not write does not appear on its own.
      - THE SITAR BENDS; YOU ANCHOR. The lead owns continuous pitch — meend, long glides,
        expressive intonation. You are FRETTED: hard attacks, stable chords, firm pitch.
        That contrast (fluid line over rigid floor) is the whole sound of this fusion, and
        it is lost the moment both instruments glide.
      - EVERY pitch gesture is SINGLE-NOTE — write slide, long_slide, pick_scrape, bend,
        hammer_on and pull_off only on notes with an EMPTY chord list. A guitarist moving a
        power chord to a new position strikes it again there; write that as two chord
        attacks, not one chord that slides. (A gesture written on a chord is dropped.)
      - Keep them RARE and SHORT — think Sad But True: one brief inflection inside an
        otherwise rigid riff. At most ONE bend or slide in a cycle, and most cycles want
        none at all. Put it on a sustained single movement note or a turnaround.
      - long_slide is a transition gesture on a SINGLE note at a section seam; pick_scrape
        is a single-note dive LEADING INTO the downbeat chord (write the scrape as its own
        short note, then the chord attack). At most one of either per cycle.
      - one or two hammer_on / pull_off figures as connective single-note motion (the
        thrash/Megadeth flavour).

    HOW TO WRITE IT:
      - IT LOOPS AND LANDS: this one cycle repeats back-to-back, returning to your first
        note/chord on the next sam. Write it so the LAST note/chord RESOLVES into the FIRST —
        a catchy riff feels like it LANDS on the downbeat, not like it restarts. Shape the end
        as a turnaround leading back to the root, never a jarring jump.
      - Your GROUND is Sa (or this riff's root) on the low string; RETURN to it constantly
        — most metal riffs repeat one pitch far more than they change pitch. A few raga
        notes for colour, never a scale run.
      - Match the subdivision: long crushing notes for a slow doom feel, short 8th/16th
        durations for a gallop or tremolo.
      - Durations are in beats: 0.25 = 16th, 0.5 = 8th, 1 = quarter, and they should sum
        to one FULL cycle ({cycle_beats} beats) — leave no gap where the loop repeats.
      - You are seated LOW already — oct 0 IS the low string (code clamps anything lower
        back up so the guitar never sinks into the bass register); use oct 0 as home and
        +1 for a lifted answering figure.

    VOICING (this is what makes it sound like a metal guitar, not a bass) — STRICT RAGA, every
    sounding tone stays inside the grammar:
      - A "chord" is extra raga SWARAS sounded WITH the root, each stacked at the lowest octave
        ABOVE it — a raga swara stacked up, NOT a fixed interval. For power-chord WEIGHT add the
        note's OWN swara (root "g" + ["g"] = root+octave); ["P"] adds Pa — a true perfect FIFTH
        only above the tonic Sa, and whatever raga interval Pa sits at above another root; ["g","n"]
        is a raga-colour voicing. Every chord swara MUST be an allowed raga swara — the same
        legality as the root. Chord the strong, accented notes (the sam and the tali) for weight;
        leave passing notes single for movement.
      - POWER WEIGHT IS THE DEFAULT: on accents reach for the root's OWN swara (the octave)
        or P (the fifth) — that is the dark, heavy metal sound. The BRIGHT colours (a second
        or third over the root — they voice as add9/tenth) make the riff light and happy:
        ration them to at most ~2 per cycle, and skip them entirely when the mood is dark.

    REPAIR (when your previous take failed the deterministic texture verifier):
    {repair}

    HARD RULES (a riff that breaks these is rejected and you redo it):
      - Use ONLY the raga's allowed swaras above — for BOTH the roots AND every chord tone.
        Sargam: S r R g G m M P d D n N. (A rest sounds nothing, so its swara is ignored.)
      - Every note needs a positive duration in beats; the durations (rests included) fill one cycle.
      - GROUND: most of the cycle sits on ONE low pitch, and you never leave it for more than
        3 notes running — a movement figure is 2-4 notes and then you COME BACK.
      - palm_mute belongs on strokes of a beat or less. Anything meant to ring is struck OPEN.
      - Pitch gestures (slide, long_slide, pick_scrape, bend) go on SINGLE notes with an empty
        chord list, at most one plain slide per cycle — most cycles want none.
      - ACCENT a chug run: vary `vel` across it (lean on the sam and the tali) so it sounds
        like a picking hand rather than a drum machine.
      - Respect the texture mode's budgets above — a cycle that misses them comes back to you
        with the exact failures listed.
  expected_output: |
    A single RiffPattern as JSON and nothing else — no prose, no code fences.
    Use exactly this shape:
    {output_schema}

# The Orchestra task: score the WHOLE chart for orchestra in ONE call (orchestration is
# holistic — long arcs, the choir/brass reserved for the peak). It emits INTENT per section
# (what each family does), NOT MIDI; code expands it. The static rulebook comes first (cache-
# friendly), the per-subgenre role brief rides {role_brief}, the section data comes LAST.
compose_orchestra:
  description: |
    You are the Orchestra — the symphonic voice of this fusion. Score the WHOLE piece in one
    pass: for each section that uses the orchestra, decide what the STRINGS, BRASS, CHOIR and
    TIMPANI do, when they enter, and the dynamic arc. You emit INTENT (a per-family plan), not
    notes — code turns your plan into a real string section, brass, choir and timpani.

    METHOD — fill `reasoning` FIRST: plan the whole-chart ARC (where the choir/brass PEAK
    lands, how the texture grows from the opening to the climax, what stays silent), THEN write
    one `sections` entry per section that uses the orchestra.

    YOU ARE A MEMBER OF THE BAND, NOT A SOUNDTRACK:
      - ANSWER the lead, do not double it. Where you want a melodic line, write a
        `countermelody` that WEAVES around the lead (call-and-response), leaving space on its
        phrases — never a copy of it.
      - REINFORCE the riff without fighting it: a sustained string pad UNDER the chug, a brass
        stab ON the accented beats. Code locks your stabs to the sam and the clapped matras.
      - LEAVE SPACE. Silence is orchestration. Not every family plays every section — reserve
        the full choir + brass + timpani for the CLIMAX so the peak actually lifts.
      - BUILD A LONG ARC across the whole piece: soft strings early, the choir entering later,
        the brass and timpani saved for the biggest moment; use `dynamic` (pp..ff) and
        `swell_into_next` (a crescendo + timpani roll into the next section) to shape it.

    STAY INSIDE THE RAGA — this is what keeps the grandeur Hindustani, not generic film score:
      - Every swara you name (string_swaras, brass_swaras, choir_swaras) and every countermelody
        note MUST be one of the raga's allowed swaras below.
      - You HOLD and COLOUR over the drone — the raga's own tones (favour Sa, the vadi, and the
        fifth). You do NOT write Western chord progressions; the harmony is modal and static.
      - A descent-only swara (see the direction rule) is touched only on the way down — do not
        build a sustained pad on it, and in a countermelody approach it from above.

    YOUR STYLE FOR THIS SUBGENRE ({subgenre}):
    {role_brief}

    THE RAGA — use ONLY these swaras:
    {raga_block}

    THE PIECE:
      motif (the shared melodic seed): {motif}
      subgenre feel: {subgenre_feel}
      tempo: {bpm} bpm   tala: {tala}
      your octaves: 0 is the strings' home; +1 up, -1 down. Code seats a full string spread
      around it (low strings an octave under), so think in the raga's register, not absolute pitch.

    THE SECTIONS TO SCORE (emit one entry per section below, by its index; skip any section
    not listed here — those do not use the orchestra). Each shows the lead and riff you must
    weave around:
    {sections}

    REPAIR (when your previous attempt left the raga):
    {repair}

    HARD RULES (a score that breaks these is rejected and you redo it):
      - Every swara — every family, every countermelody note, its grace and meend target —
        is one of the raga's allowed swaras. Sargam: S r R g G m M P d D n N.
      - Emit one `sections` entry per listed section that should have orchestra; skip the rest.
      - A countermelody answers the lead — it must not be a note-for-note copy of the lead line.
  expected_output: |
    A single OrchestraScore JSON and nothing else — no prose, no code fences.
    Use exactly this shape:
    {output_schema}

# Ustad's task: judge legality by CALLING the tool, then EXPLAIN. He never declares
# the verdict himself — code derives it from the same deterministic check — so his
# output carries only reasoning + explanation. No literal braces here; the JSON
# shape arrives via {output_schema}.
assess_legality:
  description: |
    You are Ustad, judging whether this finished composition stays legal in raga
    {raga}. Legality is NOT a matter of taste or of your ear — it is fixed by the
    raga's grammar, and the validate_composition tool is the authoritative check.

    METHOD:
      1. Call the validate_composition tool first — trust it over any hunch. It returns
         every illegal note as a list (an empty list means the piece is fully legal), so
         let its result, not your ear, decide what you report.
      2. Fill `reasoning`: state what the tool returned (how many violations, in which
         voices) — your read of its result.
      3. Write `explanation`: a short, clear account for a musician. If the tool found
         violations, name the offending swara(s), the voice (layer) each sits in, and
         what raga {raga} admits in its place (the tool's reason spells out the allowed
         swaras). If it found none, confirm the piece is clean and keeps the raga.

    THE RAGA — the single source of truth for what is legal here:
    {raga_facts}

    THE COMPOSITION UNDER REVIEW (the voices present; call the tool for the details):
    {composition_summary}

    GROUND YOUR ACCOUNT:
      - Call validate_composition and make your explanation match what it returns.
      - Report what the tool found and leave the ruling to it — the verdict is derived
        from the check, so describe the violations rather than declaring "legal"/"illegal".
      - Return only the fields asked for.
  expected_output: |
    A single UstadNarration as JSON and nothing else — no prose, no code fences.
    Use exactly this shape:
    {output_schema}

# Rasik's task: judge TASTE on a fixed rubric, grounded in encoded raga facts and a
# code-computed pakad hint. Unlike Ustad, the LLM owns the verdict here (taste is not
# checkable) — so the discipline is in the rubric and the required per-criterion
# justification, not in code overriding the result. No literal braces; the JSON shape
# arrives via {output_schema}.
assess_taste:
  description: |
    You are Rasik. Your one question about the MELODIC LINE of this composition in raga
    {raga}: does it sound like the raga? — not whether it is legal (Ustad's job) or whether
    it works as a song (the Producer's job), only the raga authenticity of the melody.
    Legality is a fact; this is your judgment — but you judge against criteria, not vibes.

    Judge the lead line below and nothing else. The guitar, bass and orchestra are not shown
    to you and are not yours to score: their notes are kept legal by code, and how they sit
    under the melody is the Arranger's job. Score what you can actually hear here.

    THE RAGA — its encoded character, the single source of truth you judge against:
    {raga_facts}

    HOW THE LINE MOVES — measured for you, because a raga is a grammar of MOVEMENT and not a
    permitted pitch set. A piece can use nothing but this raga's swaras and stop sounding like
    it the moment the line walks the ladder; these numbers are where that shows. Judge whether
    they matter musically here — a straight dash inside a fast taan is idiomatic, the same
    figure across a whole piece is the scale wearing the raga's notes:
    {motion}

    GROUNDING — a fact computed for you, so your pakad score is anchored rather than
    guessed (a phrase can be evoked without a literal quote — judge that with your ear):
    {pakad_hint}

    THE LEAD LINE — the melodic voice, in order (octave in parentheses when not 0):
    {lead_line}

    Based on the raga facts, the pakad grounding, and the lead line above, score the
    piece now.

    METHOD — fill `reasoning` first: go criterion by criterion (pakad, idiom, rasa) and
    for each cite the evidence for the score you will give — quote the lead phrase, name
    the chalan movement or the ornament, cite the vadi. Then commit `scores` and write `notes`.

    THE RUBRIC — score each an integer 1-5, and let these anchors set the boundaries:
      pakad — is the raga's signature phrase present?
              1 the pakad is absent or contradicted; 3 it is evoked or partly quoted;
              5 it is stated clearly and returned to as the line's anchor.
      idiom — does the line move like the raga (its chalan, its ornaments, the vadi
              emphasized, expressive rather than scalar)?
              1 a mechanical up/down scale; 3 mostly in-idiom with some scalar filler;
              5 idiomatic throughout — characteristic phrases, ornaments, vadi weighted.
      rasa  — does the music serve the raga's emotional essence (its rasa and samay)?
              1 the mood is wrong or absent; 3 the rasa is present but generic;
              5 the rasa is unmistakable and sustained.

    Score only on the named criterion — a short line that lands the pakad outscores a
    longer, more elaborate one that wanders; length is not quality.

    GROUND EVERY SCORE:
      - Justify each integer 1-5 in `reasoning` before you commit it, from the encoded
        raga facts and the actual lead above.
      - Judge only raga authenticity; leave arrangement, structure and songwriting to the
        Producer. Score what the notes earn — when the evidence is thin, give the honest
        low score rather than a flattering one.
      - `notes` is a short (2-3 sentence) critique a musician can act on.
      - Return only the fields asked for.
  expected_output: |
    A single RasikVerdict as JSON and nothing else — no prose, no code fences.
    Use exactly this shape:
    {output_schema}

# The Producer's task: judge COMPOSITION QUALITY — the songwriting/arrangement craft, raga-
# AGNOSTIC. The third critic dimension (Ustad=legality, Rasik=raga, Producer=song). Like
# Rasik it is LLM-as-judge disciplined by a fixed rubric + a required per-criterion
# justification, but grounded in the whole symbolic SCORE (structure, motif, riff, lead,
# ensemble), not just the lead. (Chunk B adds code-computed metrics as grounding.) No
# literal braces; the JSON shape arrives via {output_schema}.
assess_composition:
  description: |
    You are the Producer — the musical director. Your one question: does this finished
    piece work as a song? — not its legality (Ustad's job) or its raga authenticity
    (Rasik's); you are raga-agnostic and judge songwriting and arrangement craft: shape,
    build, hook, balance.

    THE SUBGENRE — the intended feel the piece must hold (for mood_fit):
    {subgenre_facts}

    THE STRUCTURE — the section timeline, the shape of the song (for structure/dynamics/climax):
    {sections}

    THE MOTIF — the shared melodic seed every voice is built on (for the motif development score):
      {motif}

    THE MAIN RIFF — one cycle of the primary rhythm figure, chords as +X, techniques as
    .name (for the hook; how many DISTINCT riffs there are and how often the main riff
    RETURNS is in the measured facts below, under "riff form"):
    {riff_line}

    THE LEAD — the melodic voice in order (for independence — it must not merely double the riff):
    {lead_line}

    THE ENSEMBLE — every voice's weight and octave range (for balance and independence):
    {ensemble}

    MEASURED FACTS — code computed these numbers for you; you judge what they mean, you do
    not recompute them. (A high motif_share is not automatically bad — too high means the
    lead never develops the motif, too low means it abandoned it; you decide.)
    {metrics}

    Based on the whole score above, rate the songwriting now.

    METHOD — fill `reasoning` first: go criterion by criterion and for each cite the
    evidence — the section timeline, the motif's recurrence, the riff, the voices and their
    density, the measured numbers. Then commit `scores` and write `notes`.

    THE RUBRIC — score each an integer 1-5, and let these anchors set the boundaries:
      structure    — 1 sections stitched together arbitrarily; 3 a workable order; 5 each section leads naturally into the next, and a returning main riff frames the form (verse/chorus-like).
      dynamics     — 1 flat throughout; 3 some variation; 5 the energy clearly builds across the arc.
      climax       — 1 every section equally intense; 3 a mild peak; 5 an earned peak and a real resolution.
      motif        — 1 stated once or never; 3 repeated but not developed; 5 introduced, varied and resolved.
      hook         — 1 forgettable, unloopable riff that never returns; 3 serviceable; 5 a memorable, loopable riff with a strong downbeat that RECURS as the song's hook.
      balance      — 1 every voice at full throughout; 3 mostly balanced; 5 real space, the lead given room.
      independence — 1 the lead just doubles the riff; 3 some overlap; 5 each voice its own line. (A bass locking to the riff root is normal metal craft — do not dock it for that.)
      mood_fit     — 1 breaks the subgenre mood; 3 mostly holds it; 5 holds the mood start to finish.
      repetition   — 1 nothing recurs OR every section identical; 3 some return; 5 the hook (a recurring riff slot) and the motif reinforced across sections without monotony.
      performance  — does this read like music PLAYED by a band rather than assembled? Judge it from the "HOW IT PLAYS" numbers: 1 the guitar barely rings and is mostly silence, chug runs sit at one velocity, and the accompaniment clashes with the melody; 3 it would play acceptably with obvious stiffness; 5 the rhythm guitar alternates attack and real resonance, its chugs breathe, and the sustained voices support the melody rather than argue with it. Nobody here hears audio — score the numbers, not an imagined recording, and do not mark a piece down twice for something you already scored under balance.

    Score only on the named criterion — a lean piece that builds and hooks outscores a
    busier, more crowded one that sprawls; length and density are not quality.

    GROUND EVERY SCORE:
      - Justify each integer 1-5 in `reasoning` before you commit it, from the score above.
      - Ground scores in the MEASURED FACTS where they apply (dynamics/climax in the energy
        curve and ornament rate, motif in motif_share, hook and structure in the riff form —
        riff_recurrence (does the main riff RETURN?) and riff_variety — repetition in
        riff_recurrence, motif_recurrence and section_variety, independence in the lead/riff
        and bass/riff and drums/tabla overlaps, balance in the register overlaps and
        everyone-playing fraction). When your score departs from a number, say why.
      - Judge the song, not the raga — a raga choice is Rasik's lane, so score what the
        music earns and leave the raga to Rasik.
      - `notes` is a short (2-3 sentence) critique a musician can act on.
      - Return only the fields asked for.
  expected_output: |
    A single ProducerVerdict as JSON and nothing else — no prose, no code fences.
    Use exactly this shape:
    {output_schema}

# The two AESTHETIC critics SHARE one debate-turn template (their differing bias lives in
# the agent backstories, not here — exactly as the composers share compose_turn). Ustad
# does NOT debate: the piece is already legal, so its legality is a settled FACT quoted as
# evidence, not a chair. Filled per turn from the Flow-owned debate state in
# crew/conductor.py. No literal braces; the JSON shape arrives via {output_schema}.
debate_turn:
  description: |
    You are {critic}, one of TWO critics in a BOUNDED debate refereed by the Conductor.
    The piece is already LEGAL (that is settled — not up for debate); now you argue whether
    it should be ACCEPTED as-is or REVISED for another pass. This is turn {turn_no} of at
    most {max_turns} — the Conductor rules when the clock runs out, so make your case count.

    THE TWO SIDES (a genuine aesthetic disagreement):
      - Rasik argues from RAGA SOUL — a legal piece can still fail the raga: the pakad
        absent, the line merely scalar, the rasa thin. When that is so, it deserves a pass.
      - The Producer argues from the SONG — does it work as music: the arc, the hook, the
        motif's development, the balance. A piece that lands as a song can ship, and a
        revise chasing more raga-idiom can flatten a drive that already works.

    PACING (important): hold your core concern on turn 1 — defend it first and make the
    other side earn any concession, which you give only for a genuinely decisive point and
    only later in the debate. Argue your own dimension and stay in your lane (Rasik: the
    raga, not songwriting; Producer: the song, not the raga).

    METHOD — fill `reasoning` FIRST (your read of the other side and the evidence), then
    `argument` (your point), `stance`, and `target_layer`.

    THE VERDICTS (Ustad's legality is a FACT, not a debater):
      Ustad (legality, settled): {ustad_summary}
      Rasik (raga authenticity): {rasik_summary}
      Producer (composition quality): {producer_summary}
      Flagged below the line: {flagged}

    THE COMPOSITION:
      raga: {raga}
      voices present: {voices}
      the lead line: {lead_line}

    THE DEBATE SO FAR:
    {transcript}

    YOUR TASK THIS TURN:
      - Make your argument in ONE or two sentences, in character (Rasik: pakad, idiom,
        rasa; Producer: structure, motif, hook, balance, the song's arc).
      - Set `stance` to "accept" or "revise".
      - If your stance is "revise", set `target_layer` to the ONE voice to regenerate
        (e.g. "lead", "rhythm") — the most impactful fix, not a list.
  expected_output: |
    A single DebateTurn as JSON and nothing else — no prose, no code fences.
    Use exactly this shape:
    {output_schema}

# The Conductor's ruling — the referee's final call. It MUST rule now (the clock has
# run out); legality is already enforced by code, so this is an aesthetic judgment.
# No literal braces; the JSON shape arrives via {output_schema}.
arbitrate:
  description: |
    You are the Conductor — the referee with a clock. Rasik and the Producer have debated
    whether this composition should be accepted or revised, and now YOU make the final
    call. Rule now: the debate is over, so commit to a decision this turn.

    Legality is non-negotiable and is already enforced by code, so your call is an
    aesthetic one: soul versus works-as-music. Is Rasik's case that the raga needs more
    soul, or the Producer's case that the songwriting needs work, strong enough to justify
    another pass — or does the piece already land well enough to ship? A revise costs time,
    so spend it only when it will clearly make the music better; otherwise accept and move on.

    MATCH THE REPAIR TO THE FAULT. Some complaints are about a PART being weak, and those
    want that part composed again. Others are about how the parts SIT TOGETHER — and
    regenerating a good voice to fix a relationship throws away work and re-rolls the dice
    on the same problem. Pick the operation that addresses what the critics actually said.

    METHOD — fill `reasoning` FIRST (weigh the two sides against the evidence), then rule.

    THE VERDICTS:
      Ustad (legality, settled): {ustad_summary}
      Rasik (raga authenticity): {rasik_summary}
      Producer (composition quality): {producer_summary}
      Flagged below the line: {flagged}

    THE DEBATE:
    {transcript}

    THE REPAIRS YOU MAY CALL FOR:
    {operations}

    YOUR RULING:
      - `directive`: "accept" or "revise".
      - If "revise": `operation` = one of the repairs above, and `reason` = a SHORT
        surgical directive the performer of that repair can act on (WHAT to fix, e.g.
        "state the raga's pakad and lean on the vadi", or "a catchier, more varied riff
        built on one restated hook") — concrete enough to act on, not a vague "improve it".
      - If "accept": `reason` = one line on why the piece is good enough to ship.
  expected_output: |
    A single ConductorRuling as JSON and nothing else — no prose, no code fences.
    Use exactly this shape:
    {output_schema}

# The Arranger's per-section decision. The prompt carries NO raga facts and NO legality
# rules on purpose: every offered repair is already legal (code built the menu), so adding
# grammar would invite the model to re-derive a decision it cannot improve. One task = one
# objective = one output: pick a repair per clash.
arrange_against_lead:
  description: |
    The guitar and the sitar have each been composed well on their own, and in this section
    they fight in a few places. Decide what to do about each one.

    THE SECTION — kind: {section_kind}; gat role: {form_role}

    WHAT TO AIM FOR:
      - Under a HELD melody note the guitar holds a FLOOR. The listener is following the
        sitar there, so the guitar's job is weight and steadiness — simplify rather than
        argue: drop a colour tone, keep the root, damp the note to a percussive touch.
      - Under a STABLE note there is more room; a fuller repair can wait if the clash is
        brief and the guitar is about to move anyway.
      - Harmony that moves because the TUNE moved is what makes chords feel random. When a
        root change is flagged as chasing, holding the previous root usually sounds more
        intentional — the floor stays put while the melody travels over it.
      - Friction is not a fault. Keep a clash that sounds deliberate: a bite against a fast
        line, a moment of tension going into a climax. "keep" is a real answer, and a
        section where you keep one or two clashes usually sounds more alive than one you
        have sanded smooth.

    THE CLASHES — each is numbered, with the repairs available for it. Choose ONE repair
    per clash, by its exact id:
    {findings}

    WHAT EACH REPAIR DOES:
      - damp: the guitar note loses its chord, shortens to a chug and softens — the clash
        becomes a percussive touch instead of a sustained grind.
      - drop_tone:X — the chord keeps its root and loses just the tone that fights.
      - reseat_riff:X — the guitar's root moves to X, which sits consonantly under the
        melody there.
      - hold_root:X — the guitar stays on X instead of changing root mid-phrase.
      - reseat_lead:X — the melody note moves to X. The melody is the piece here, so this
        is offered only where the guitar carries the section; prefer it only when the
        guitar's figure is clearly the identity and the melody note is incidental.
      - keep: change nothing.

    Give your reasoning first — say what the melody is doing in this section and what the
    guitar should therefore be doing under it — then one choice per clash.
