# Task definitions (description/expected_output) — one objective per task.
# {placeholders} filled from kickoff inputs. output_pydantic is set in Python.

interpret_query:
  description: >
    You extract the musical values a user actually wrote in their request, as
    structured data. This is extraction, not composition: copy only what the request
    states and leave the rest for the code — every creative decision is made downstream.

    METHOD — fill `reasoning` first, then the value fields. In `reasoning`, go field
    by field (raga, key, subgenre, mood, bpm, tala, laya, instruments, duration_s,
    playable_rhythm) and for each
    state either the exact words from the request that give it, or "not stated". Then
    set each field to that value, or null wherever you wrote "not stated". A field the
    request does not mention stays null. It is normal and correct for most fields to be
    null — a bare "a heavy metal fusion" fills only mood.

    FIELD DEFINITIONS — fill each only from the request, else null:
      raga        a Hindustani raga the user names, else null.
      key         a musical key/note the user names, e.g. "D", "E flat", else null.
      subgenre    a metal genre the user names: thrash, doom, death, progressive,
                  black, melodic death, heavy, or symphonic. A vibe word counts as mood,
                  not subgenre. Else null.
      mood        an emotional / vibe word or two the user uses (dark, angry,
                  romantic, epic, crushing). One or two words — a genre name goes in
                  subgenre, and the whole request never belongs here. Else null.
      bpm         a tempo NUMBER the user gives (e.g. "120 bpm"), else null. A tempo WORD
                  like "vilambit" or "slow" is NOT a bpm — it goes in laya.
      tala        a Hindustani rhythmic cycle the user names: teentaal, jhaptaal, ektaal,
                  rupak, keherwa, or dadra. Copy just the tala name even if the request wraps
                  it ("in vilambit teentaal" -> tala "teentaal", laya "vilambit"). Else null.
      laya        a tempo CLASS the user names: vilambit (slow), madhya (medium), or drut
                  (fast) — or its English gloss (slow / medium / fast). Else null.
      instruments specific instruments the user wants IN the piece (tabla, drums, sitar,
                  ...). A vibe word or a phrase counts as mood, not an instrument. Else null.
      duration_s  the length of the piece the user states, converted to whole SECONDS
                  ("60-second" -> 60, "two minutes" -> 120, "1:30" -> 90). Else null.
      playable_rhythm  true ONLY when the user asks for the rhythm-guitar part to be
                  playable by a human (e.g. "I will play rhythm guitar live", "keep the riff
                  playable"). Else null.

    GROUNDING RULES:
      - Copy only spans that appear verbatim in the request; leave every field the
        request omits null.
      - Keep each field to its short value — a raga name, a key, a genre word — not the
        whole request or a long phrase.
      - For a value the request omits, emit JSON null (not the string "null", a 0, or []).

    Request to extract from:

        "{query}"
  expected_output: >
    A RawIntent JSON with `reasoning` FIRST (your per-field grounding: the exact
    words that set each field, or "not stated"), then raga, key, subgenre, mood,
    bpm, tala, laya, instruments, duration_s, playable_rhythm — each set only if this request
    states it, otherwise null.

# The composers share ONE task template (their differing bias lives in the agent
# backstories, not here). {placeholders} are filled per turn from the evolving Flow
# state in crew/composers.py. Note: no literal braces in this template — the JSON
# shape is injected via {output_schema} so CrewAI's interpolation never sees a
# stray brace.
compose_turn:
  description: |
    You are {composer}, one of two composers shaping a Hindustani-raga x metal
    fusion together. This is turn {turn_no} of at most {max_turns}. You and your
    counterpart hold OPPOSITE priorities but share one goal: a great fusion. Make
    your case — and converge: concede a point when the other's argument is strong.

    METHOD — fill `reasoning` FIRST (your private monologue), then the draft and note:
      In `reasoning`, analyze your counterpart's last turn — name ONE musical element
      you respect and ONE you must push back on — and let that shape your revision.
      (On the opening turn, reason about how to serve BOTH tradition and metal at once.)

    PACING — weigh turn {turn_no} against {max_turns}:
      - First half of the debate: boldly push your genre's priorities.
      - Second half: prioritize SYNTHESIS — merge your counterpart's ideas with yours
        (e.g. play the metal riff USING the raga's meend/slides, or set a tihai as the
        breakdown).
      - On the FINAL turn (turn_no == max_turns): output a fully compromised, working
        draft and set agree to true.

    THE REQUEST (honor what is FIXED exactly; decide only what is OPEN):
    {brief_context}

    THE FORM BUDGET (code computed it from the request; the guardrail enforces it):
    {form_budget}

    THE USER'S OWN WORDS (verbatim — the request above was extracted from them):
    {user_request}
    The FIXED values already carry what these words pin down. Everything else they ask of
    the MUSIC — the form, how the ideas develop, how the piece opens and ends, who plays
    what — is yours to honour in the chart. Write it into the form, the section intents and
    the transitions: the voices that compose each section read your intents. Where the
    words ask for something the facts below rule out, keep the facts and serve the intent.
    Asks about files, deliverables or how the result will be used are outside the chart.

    THE FACTS YOU CHOOSE FROM (the single source of truth — do not contradict these):
    Ragas:
    {raga_context}
    Talas:
    {tala_context}
    Subgenres:
    {subgenre_context}
    Section kinds you may use (how a block is RENDERED):
    {section_kinds}
    Form roles — what each section DOES in the GAT form, orthogonal to its kind (in the SONG
    form a section may carry intro/breakdown/taan_long/tihai/outro where it genuinely fits,
    and otherwise no form_role):
    {form_roles}
    Layers (voices) you may activate per section — tabla and the metal drums CAN
    play together (tabla holding the theka under the metal groove is a core fusion
    sound); honor any instruments the user named in the request above. Give the
    taan_long section the TABLA: the theka carries the tala under the taan and through the
    short breath before the re-entry sam. The taan is a RISING energy section, not a band
    dropout — the sitar becomes more virtuosic BECAUSE the drums underneath push harder,
    while the guitars simplify to sustained weight. Code thins the band for a few matras
    just before the sam when a section asks for it (`climax_style: exposed`); that hole is a
    held breath the band slams back into, never a whole cycle without the band:
    {layer_roles}
    Pakad seeds — idiomatic phrases to inspire your motif (quote them, vary them, or
    depart from them, but the motif must stay inside the raga's allowed swaras):
    {seed_context}

    THE CONVERSATION SO FAR:
    {transcript}

    THE CURRENT DRAFT:
    {current_draft}

    YOUR TASK THIS TURN:
      - If there is no draft yet, PROPOSE a complete arrangement from your point of view;
        otherwise REVISE the current draft — change what matters to you, keep what works.
      - CHOOSE THE FORM and declare it in `form` — two forms serve this fusion, both in tala
        cycles:
          * "gat" — the Hindustani instrumental form: an intro/alaap, then a MUKHADA (the
            recurring melodic + rhythmic head that resolves to the sam), developed through a
            manjha and a higher-register antara, the mukhada RETURNING as the hook, ONE long
            taan/solo for the peak (after the antara or before the final mukhada), and an
            outro. Set `form_role` on EVERY section to name its place in this form; the
            mukhada appears at least twice (stated, then returned as the hook).
          * "song" — a metal song built on ONE main riff: an intro, the main riff and its
            hook, a development, a contrast (a breakdown or a bridge), the main riff RETURNING
            varied and heavier, a climax (a taan_long or solo fits here when it serves the
            piece), and the ending. The sections ride `kind` and `riff_slot` — the main riff's
            sections share one slot so it comes back. `form_role` is optional: use intro,
            breakdown, taan_long, tihai or outro where they genuinely fit and leave it null
            elsewhere; mukhada/manjha/antara/amad belong to the gat form.
        Choose by the music and the length: a piece under about two minutes usually lands
        harder as ONE memorable idea and its development (the song form); a longer piece, or
        a request for a gat, carries the full gat.
      - DECLARE THE ANCHOR (`anchor`): ONE idea seeds the whole piece — gat_first (the sitar
        mukhada is the source; the main riff is a rhythmic REDUCTION of it) or riff_first (the
        riff is the source; the mukhada QUOTES the riff's accented notes). Do not invent two
        unrelated ideas — the riff and the gat are two faces of one anchor.
      - Write `note` as a SHORT (1-2 sentence) argument to your counterpart, IN CHARACTER
        (Pandit argues rasa, swara purity, phrasing, meend; Riffsmith argues groove,
        sonic weight, tension and drive).
      - DIRECT THE PLAYERS, don't just lay out blocks: give EVERY section an `intent` — one
        line of MUSICAL direction (what the section should feel and do: motif treatment,
        register, texture, how sitar and riff interact), not a restatement of its kind. The
        generators read it verbatim; an empty intent wastes your only channel to them.
      - DESIGN THE SEAMS, not just the blocks: for each section set `transition` to say
        HOW it hands off to the next (a 3-beat silence, "tabla fades as feedback swells",
        a shared tihai/unison landing on the sam) — fusion fails at the handoffs.
      - SHAPE THE RIFFS LIKE A SONG: give every rhythm section a `riff_slot` — a small
        library of named riffs ("main", "chorus", "breakdown"). REUSE "main" wherever the
        main riff should RETURN (the hook — repetition is what makes it a song, and a
        recurring riff on the sam is a mukhda coming back); give the chorus and breakdown
        their OWN slots so they contrast. Sections sharing a slot replay the SAME riff.
      - DECIDE THE HARMONY per section (`harmony`) — how the music moves UNDER the melody:
        "drone" (no motion — the tanpura dyad; the alap and the taan climax), "modal_pedal"
        (the raga-metal DEFAULT — a Sa pedal under CHANGING colour tones; set `roots` to the
        colour swaras or leave them empty for the vadi/samvadi), or "progression" (a short
        per-avartan chord-root cycle, for a CHORUS-like section only: 2-4 raga swaras with
        the LAST one S, so the cycle comes home — this music's gravity is melodic, and a
        cycle that ends away from Sa is rejected). Activate the `clean` layer wherever the
        harmony should be HEARD as arpeggios — an intro shimmer, colour under a melody, a
        breakdown afterglow.
      - For a climactic section (taan/breakdown), negotiate a RHYTHMIC UNISON — a tihai
        (a phrase thrice, resolving on the sam) doubling as the metal breakdown, or the
        double-kick locked to the tabla's bols. Shape an ENERGY CURVE: don't run every
        layer at full throughout; let the lead rise into the higher octave to pierce a
        heavy riff, and leave space.
      - Set agree to true when the draft already serves BOTH tradition and metal well.

    HARD RULES (a draft that breaks these is rejected and you will be asked to redo it):
      - Honor every FIXED value in the request exactly.
      - Choose raga, subgenre and tala only from the supported lists above.
      - The motif is your melodic seed: use ONLY the chosen raga's allowed swaras.
        Sargam is S r R g G m M P d D n N (lowercase = komal/flat, M = tivra Ma).
      - Every section's foreground must be one of that section's own layers.
      - Every section that includes the `rhythm` layer must carry a `riff_slot` — reuse a
        slot to bring a riff back, use a new slot for a contrasting riff.
      - Declare `form` ("gat" or "song"). GAT form: every section carries a `form_role`, and
        a MUKHADA is STATED and RETURNS (at least two sections 'mukhada'). SONG form: one
        riff_slot recurs (the main riff returns), and no section uses a gat-only role
        (mukhada/manjha/antara/amad). Either form: 'taan_long' sections within the FORM
        BUDGET's cap.
      - Keep bpm within the chosen subgenre's range.

    BEFORE YOU FINALIZE — run this CHECKLIST over your own draft (each miss is a rejected
    turn and a redo, so verify first):
      [ ] every FIXED value honored; raga/subgenre/tala from the supported lists
      [ ] motif uses ONLY the raga's allowed swaras
      [ ] `form` declared; every section's foreground is one of its own layers
      [ ] every section: a one-line musical `intent` and a `transition` into the next
      [ ] every rhythm section carries a riff_slot (reuse = the hook returns)
      [ ] BOTH forms: 'intro' only on the FIRST section, 'outro' only on the LAST (an intro
          label makes the lead play a slow alap — never put it on a riff or melody section)
      [ ] GAT form: form_role on every section, 'mukhada' on at least TWO sections (stated +
          returned), the intro meets the FORM BUDGET's minimum, and every manjha sits AFTER a
          mukhada and is IMMEDIATELY followed by one that meets the budget's return minimum
      [ ] SONG form: the main riff's slot appears on at least two sections, and no section
          uses mukhada/manjha/antara/amad
      [ ] 'taan_long' within the cap; the bars add up to the FORM BUDGET's length (when one
          is fixed)
      [ ] the metal drums keep driving the taan — the sitar's speed rides the band's
          propulsion; any exposure is a brief breath before the sam, not a cycle off
      [ ] harmony roots are raga swaras; any progression has 2-4 roots ENDING ON S, sits on
          a chorus-like section (never intro/taan_long/outro), and roots avoid the raga's
          descent-only swaras
      [ ] bpm within the subgenre's range
      [ ] `ending` matches how the piece should stop — "hard_stop" when it should land one
          stroke on the final sam and cut to silence, else "ring_out"
  expected_output: |
    A single ComposerTurn as JSON and nothing else — no prose, no code fences.
    Use exactly this shape:
    {output_schema}

# The single COMPOSER's SEED (crew/composer.py, behind RMA_COMPOSER): ONE call co-writes the chart,
# the main riff and the hook — the core idea in one context (the single bare call that beat the
# multi-agent pipeline wrote everything in one breath). Hard constraints are stated as hard (the
# guardrail enforces exactly these); everything else is a palette. Braces live only in placeholders.
compose_seed:
  description: |
    You are the Composer of a Hindustani-raga x metal fusion: ONE musician who owns the whole
    piece. Write its CORE IDEA in one go — the chart, the MAIN RIFF and the sitar's part — conceived
    together, the way a band's songwriter brings in a riff, a melody that sings over it, and a
    plan for the song. Everything later DEVELOPS what you write here; nothing replaces it.

    METHOD — fill `reasoning` FIRST: the one idea (what the riff and the sitar share — a rhythm, a
    pair of swaras, a shape), how the form develops it, and where the climax lands. Then
    `energy_arc` (one short line per section: how intensity moves), then the chart, the main riff
    and the sitar's part (`hook` in the song form, `head` in the gat form).

    THE REQUEST (honour what is FIXED exactly; decide only what is OPEN):
    {brief_context}

    THE FORM BUDGET (code computed it from the request; the guardrail enforces it):
    {form_budget}

    THE USER'S OWN WORDS (verbatim):
    {user_request}

    THE FACTS YOU CHOOSE FROM (the single source of truth):
    Ragas:
    {raga_context}
    Talas:
    {tala_context}
    Subgenres:
    {subgenre_context}
    Section kinds:
    {section_kinds}
    Form roles (the GAT form's places; the SONG form uses intro/breakdown/taan_long/tihai/outro
    only where they fit):
    {form_roles}
    Layers (voices) per section:
    {layer_roles}
    THE RIFF PALETTE — per raga, the riff's home root, its HALF-STEP neighbours (one way to grind:
    the power-chord shape moved a fret between them and back) and which roots carry a full
    power chord:
    {riff_palette}

    WHAT TO WRITE:
      - THE CHART (`chart`): the form ("gat" or "song" — a piece under about two minutes usually
        lands harder as ONE idea developed, the song form), the sections with a one-line musical
        `intent` and a `transition` each, the anchor, the ending, the harmony, the motif. Its
        shape is the `draft` object below.
      - THE MAIN RIFF (`main_riff`): ONE tala cycle of the riff that RECURS (the slot shared by the
        most rhythm sections — normally "main"). It is the band's figure, something the drums lock
        to and the ear recognises on return; which roots, how much it moves, its rhythm and its
        register are yours. A riff is not the raga's scale walked up and down in power chords —
        that is a melody. Write ROOTS and RHYTHM; code voices every bare stroke as a power chord
        inside the raga.
      - THE SONG FORM — THE HOOK (`hook`; leave `head` out): ONE avartan the sitar sings over the
        main riff, recurring with it. Unmistakably THIS raga — quote, vary or only allude to its
        pakad and chalan, in a shape of your own — singable, resolving on a resting swara of the
        raga, its last note leading back into its first (it loops). In a riff_first piece it
        QUOTES the main riff: sound the riff's swara on at least half of the riff's sam/tali beats.
      - THE GAT FORM — THE HEAD'S IDEA (`head`; leave `hook` out): not the head's notes but what
        makes it THIS head — a gat composer writes the notes from it next, with its whole
        attention, beside the manjha and antara. Spend your effort on the idea:
          * `sam_swara` — the swara that sounds ON every sam, struck "da": a strong arrival you
            choose deliberately (real gats land the sam on Sa, Pa, Ma, even Re — not always Sa);
          * `cell` — the few swaras of the core cell that recurs, from the raga's pakad and chalan
            or alluding to them;
          * `stroke_line` — the right hand, one token per matra of the avartan on the stroke frame
            below (a bol word, or "-" where a note rings on — no chikari inside a head): the head's
            rhythmic HOOK, as recognisable clapped as sung — a gat played as plain notes sounds like
            a keyboard melody. Plan ONE sentence, not equal cells: a quick figure, a held breather,
            then the approach into the sam;
          * `idea` — one line naming what the head is.
        In a riff_first piece let the sam swara and the cell come from the riff's own swaras —
        the composed head must sound the riff's swara on at least half its sam/tali beats.
      - In a sitar gat the STROKE PATTERN is often the motif: a recurring bol figure can be what
        the ear holds on to, as much as the swaras; where it fits, the riff's attacks can echo it.
      - YOUR STARTING POINT: {approach}
    {gat_strokes}
      - Make the riff and the sitar's part ONE idea — how they relate is yours to decide, with
        one fixed relationship: in a riff_first piece the head quotes the riff (that is what
        riff_first means).

    HARD RULES (only these get the seed rejected):
      - The chart honours every FIXED value and the FORM BUDGET; every foreground is one of its
        section's layers; every rhythm section names a `riff_slot`; 'intro' only on the first
        section and 'outro' only on the last; 'taan_long' within the cap;
        harmony roots are raga swaras and a progression has 2-4 roots ending on S; bpm within the
        subgenre's range.
      - GAT form: every section carries a `form_role`; 'mukhada' on at least two sections; the
        intro meets the budget's minimum; every manjha sits after a mukhada and is immediately
        followed by one that meets the budget's return minimum; at most one lead-less section,
        at most 2 bars. SONG form: the main riff's slot on at least two sections; no section uses
        mukhada/manjha/antara/amad.
      - Every swara — chart motif, riff roots and chord tones, hook notes, graces and meend
        targets — is in the chosen raga, and one-directional swaras are entered from their side.
      - The main riff's durations (rests included) fill exactly one cycle; a palm-muted note is
        a beat or shorter; slides and bends sit on single notes.
      - SONG form: a `hook` that fills about one avartan, ends on a resting swara and does not end
        on the note it opens with. GAT form: a `head` whose sam_swara and cell are swaras of the
        raga.

    THE OUTPUT — one SongSeed JSON object with five keys, in this order: "reasoning" (text),
    "energy_arc" (text), "chart" (the draft object), "main_riff" (one riff cycle), and then the
    sitar's part — "hook" (one lead phrase) in the song form, or "head" (the head's idea) in the
    gat form.
    The chart:
    {chart_schema}
    The main riff (one cycle):
    {riff_schema}
    The song form's hook (one phrase):
    {phrase_schema}
    The gat form's head idea:
    {head_schema}
  expected_output: |
    A single SongSeed JSON object and nothing else — reasoning, energy_arc, chart, main_riff, and
    the hook (song form) or the head idea (gat form) — every swara legal in the chosen raga.

# The SEED DEBATE (crew/seed_debate.py). A debate turn is the compose_seed task with this block
# appended (same facts, schemas and hard rules — never a second copy of the seed prompt), and its
# own expected output. The selector is a separate, short task.
debate_seed:
  addendum: |

    THE DEBATE — another composer answered the same request independently. Here are YOUR seed and
    THE RIVAL'S seed — the notes, and code's measurements of both:
    {debate}

    Argue first (`argument`, 3-5 sentences): where the rival's seed is stronger than yours and
    where yours is stronger, judged on the NOTES and the MEASUREMENTS — the gat's strokes and its
    stroke motif, how the head lands on the sam, how the hook and the riff share accents and
    attacks, whether it is unmistakably this raga, and whether it answers the request.
    Then return YOUR seed (`seed`): revise it where the rival or the numbers persuaded you — take
    a principle, never the rival's notes — and return it unchanged where yours is already the
    stronger idea (`changed`: false). Do not merge the two ideas: your seed stays your own. Every
    hard rule above still applies to it.
  expected_output: |
    A single DebateTurn JSON object and nothing else: "argument" (3-5 sentences), "changed"
    (true or false), and "seed" — a SongSeed exactly as specified above.

debate_head:
  description: |
    You are a composer of a Hindustani-raga x metal fusion, in a studio session with a second
    composer. You each wrote the GAT HEAD for the same piece — the mukhada, one avartan that returns
    on every sam — from your own approach. This is round {round} of at most {rounds}.

    YOUR APPROACH (yours alone; the other composer was given a different one):
    {approach}

    THE RAGA (the single source of truth — every swara you write must be legal here):
    {raga_block}

    Tempo: {bpm} bpm    Tala: {tala}    One avartan = {cycle_beats} beats.

    THE STROKE FRAME — the head's rhythmic identity (bols are strokes, not pitches):
    {bol_frame}

    WHAT THE USER ASKED FOR (verbatim): {user_request}

    THE TWO HEADS, as they stand — swara(octave):bol(beats), the head loops back to its first note
    on the sam — and code's measurements of each:
    {debate}

    Argue first (`argument`, 3-5 sentences): where the other head is stronger than yours and where
    yours is stronger, judged as music a listener hears — is it unmistakably this raga, does it sing,
    does it land on the sam, will it be remembered. Then decide. Keep your head when it is already the
    stronger idea (`changed`: false — return it exactly as it is, and say why). Revise it when the
    other head or the measurements persuaded you (`changed`: true) — take a principle, never the other
    head's notes, and stay true to your own approach.

    The head must fill exactly {cycle_beats} beats, use only the raga's swaras in their legal
    direction, be one continuous sentence with no rest and no chikari inside it, and hold one note,
    struck once, for at least two beats. Return it in this shape — the phrase_plan first, then the
    notes that realise it:
    {output_schema}
  expected_output: |
    A single HeadTurn JSON object and nothing else: "argument" (3-5 sentences), "changed" (true or
    false), and "head" — a gat head exactly as specified above.

revise_head:
  description: |
    You are a composer of a Hindustani-raga x metal fusion. You wrote the GAT HEAD for this piece —
    the mukhada, one avartan that returns on every sam. Code has measured it against the raga's
    facts. This is revision pass {round} of at most {rounds}.

    YOUR APPROACH:
    {approach}

    THE RAGA (the single source of truth — every swara you write must be legal here):
    {raga_block}

    Tempo: {bpm} bpm    Tala: {tala}    One avartan = {cycle_beats} beats.

    THE STROKE FRAME — the head's rhythmic identity (bols are strokes, not pitches):
    {bol_frame}

    WHAT THE USER ASKED FOR (verbatim): {user_request}

    YOUR HEAD, as it stands — swara(octave):bol(beats), the head loops back to its first note on
    the sam — and code's measurements of it:
    {your_head}

    Critique first (`argument`, 3-5 sentences): where your head is strong and where it is weak,
    judged as music a listener hears — is it unmistakably this raga, does it sing, does it land on
    the sam, will it be remembered. Then decide. Keep your head when it is already strong
    (`changed`: false — return it exactly as it is, and say why). Revise it when your critique or
    the measurements persuaded you (`changed`: true), staying true to your approach. A revision
    fixes what was missed without losing what was met; it is not a new head.

    The head must fill exactly {cycle_beats} beats, keep its first note (the sam swara, in the same
    octave), use only the raga's swaras in their legal direction, be one continuous sentence with
    no rest and no chikari inside it, and hold one note, struck once, for at least two beats.
    Return it in this shape — the phrase_plan first, then the notes that realise it:
    {output_schema}
  expected_output: |
    A single HeadTurn JSON object and nothing else: "argument" (3-5 sentences), "changed" (true or
    false), and "head" — a gat head exactly as specified above.

select_seed:
  description: |
    You are choosing the strongest MUSICAL IDENTITY for a Hindustani-raga x metal piece: a chart,
    a main riff and the sitar's hook, written by composers who answered the same request. You
    choose ONE; nobody merges them. The candidates are labelled 1 to {count}; their order and
    labels carry no meaning, and neither does how much a composer wrote about its own idea.

    WHAT THE USER ASKED FOR (verbatim):
    {user_request}

    THE CANDIDATES — each with its notes (the hook as swara:bol(beats), or a gat seed's head idea)
    and code's measurements:
    {candidates}

    Judge the NOTES, with the measurements as evidence, on these five, in this order of weight:
      1. A sitar gat head, unmistakably: the strokes carry it (bols on most notes, dir / dar
         figures, a recurring stroke motif), and it lands its home swara on the sam.
      2. A hook the ear keeps: one figure stated and answered, singable, recognisable on return.
      3. The hook and the riff are ONE idea: they share accents and attacks, a register apart.
      4. The raga is unmistakable: its pakad and chalan move the line, not its scale.
      5. It answers the request.
    Reason through each candidate on these points first, then choose.
  expected_output: |
    A single SeedChoice JSON object and nothing else: "reasoning" (each candidate weighed on the
    five points), then "choice" — the label (1 to {count}) of the strongest candidate.

# The Lead generator fills ONE section per call. It emits notes as swaras with
# DURATIONS (not start times) — the arrangement code lays the phrase across the
# section window and places it in the lead's register. No literal braces here; the
# JSON shape arrives via {output_schema}.
# generate_lead is ORDERED FOR THE CACHE + THE MODEL (2026-07-16 latency campaign):
# the static rulebook comes FIRST (an identical prefix across every lead call, so Gemini's
# implicit caching can hit), the ONE relevant role brief rides {role_brief} (code picks it —
# the old prompt taught every gat role on every call), the per-section data comes LAST, and
# the final line asks for the composition AFTER the data (Gemini long-context guidance).
generate_lead:
  description: |
    You are the Lead — the raga's melodic voice in the Hindustani tradition: you compose the gat
    and improvise around it. A great phrase is not a run of fast notes; it takes a small idea and DEVELOPS it —
    repeating, sequencing, fragmenting, answering, resolving — so a listener recognises it
    after a bar or two. Compose ONE phrase for the single section described at the end. Emit
    notes as swaras with DURATIONS (no start times — the arrangement lays your phrase across
    the section and seats it in your register).

    METHOD: fill `phrase_plan` FIRST — the schema below explains each field — THEN write
    `notes` that REALISE that plan: the seed appears and returns, developed the way you
    described, tracing the contour you chose.

    BUILD FROM THE RAGA, NOT THE SCALE — a listener should hear WHICH raga this is in how the
    line moves:
      - The pakad and chalan (vakra / zig-zag) fragments below are your material: quote them,
        vary them or only allude to them where the raga should be heard — often where a phrase
        begins or comes to rest — and let connective passages move freely inside the grammar.
        A line that walks the scale loses the raga; one that paraphrases the pakad end to end
        loses the idea.
      - DEVELOP the seed the way this music does: repeat it, FRAGMENT it, answer it, compress
        or stretch it rhythmically (layakari), move it to another octave, or shift where it
        comes to rest (nyas) — these are the raga's own devices and always safe.
      - SEQUENCE — restating the shape from a new degree — only where the chalan actually
        supports that move. Marching one contour up through successive degrees is a Western
        device: it can be perfectly legal and still erase the raga, especially in a vakra
        raga whose zig-zag IS its identity. When in doubt, develop rhythmically instead.
      - QUESTION and ANSWER: give it form — a statement and its answer, a varied return —
        shaped to your section's job below rather than to one fixed scheme.
      - DEVELOP ACROSS SECTIONS TOO: restate or vary the motif and your earlier phrases (your
        memory of the piece is below), ANSWER the previous section, and shape the whole arc —
        reserve the highest intensity for the climax.

    NYAS AND SPACE — the music BREATHES; neither a pause after every note nor every beat filled:
      - LAND THE SAM: matra 1 of each cycle is the arrival — land on one of the raga's resting
        swaras (the raga facts list them; not always Sa) and let it RING or REST there.
      - Silence is a choice your section's job sets: true RESTS (set "rest": true) where the
        phrase breathes, settling on the raga's resting notes. A gat head runs without silence —
        its breath is a HELD resting swara just before its approach.
      - FAST RUNS LAND: where your section has a fast run, let it arrive on a held or resolving
        note rather than blur — your section's job says how fast it goes and how it is shaped.

    ORNAMENTS AND STROKES — reserve them for where they SING; fast notes speak plainly:
      - grace: a short list of kan swaras flicked just before the main note.
      - meend_swara: a glide INTO a held note (at least a beat long) — the schema explains
        the mechanics; put it on sustained/resting notes and leave fast notes clean. Grace
        and meend swaras must be legal swaras of this raga.
      - bol (the sitar's mizrab stroke): mix "da" (strong) and "ra" (softer) with the compound
        figures — "dir", "rda", "dar", "dara", "dadir", "darada", "daradara" — whose strokes divide
        the note in their ratios, at whatever length you give it; "chikari" sparingly, to
        punctuate a phrase-end or answer the tabla — never inside a gat head. On the gat HEAD the right hand is planned
        first (phrase_plan.stroke_line — see THE STROKE FRAME) and every note carries the bol
        its matra asks for; vary other cells by bol-bant (redistribute the bols, keep the
        melodic DNA).
      - ornament ("murki" delicate / "khatka" sharper): ONLY if the raga facts below list
        them (most ragas do NOT — the grave, meend-driven ragas use andolan/meend instead).
        Place on a HELD note (~half a beat+), favour the raga's komal swaras, a couple per
        phrase at most; code builds the cluster from the raga's own neighbours.

    HARD RULES (only these get a phrase rejected — they make it legal and placeable):
      - Use only the raga's allowed swaras below — for the seed, each note, its grace, and its
        meend target. Sargam is S r R g G m M P d D n N (lowercase = komal/flat, M = tivra Ma).
      - Every note has a positive duration, in beats.
      - Fill your window and land your seam: rests count toward the window exactly as notes
        do (a deliberate silence IS part of the phrase); an overrun is truncated, and a phrase
        that stops short of the window leaves an unplanned gap.
    CRAFT (reported back, never a rejection): realise your phrase_plan — the seed appears and
    develops as you said; develop one idea — a long mechanical up-and-down scale reduces the raga
    to a scale. The craft in your section brief is guidance of the same kind.

    From here down to YOUR SECTION'S JOB, everything is the same for every section of this
    piece; the section you are composing now is described after it.

    THE OUTPUT SHAPE — return a single LeadPhrase as JSON in exactly this shape:
    {output_schema}

    THE RAGA — use ONLY these swaras; the pakad and chalan below are your raw material:
    {raga_block}

    THE PIECE (shared by every voice so the parts lock together):
      motif (the common melodic seed): {motif}
      subgenre feel: {subgenre_feel}
      tempo: {bpm} bpm
      your octaves: 0 is home (madhya); -1 the lower (mandra), +1 the upper (taar). Roam
      across them the way a raga does — the arrangement already seats you above the riff.

    THE SONG'S CORE IDEA (when the Composer seeded the piece, YOU wrote it — build on it):
    {song_seed}

    WHAT THE USER ASKED FOR (verbatim). The composers already turned it into the sections;
    honour what it asks of the MELODY here — a motif to keep returning, how this section or
    the piece should land. The raga and the section below take precedence where they differ:
    {user_request}

    YOUR SECTION'S JOB in the whole composition:
    {role_brief}

    THE STROKE FRAME — the gat's bol identity (applies when your section is the head):
    {bol_frame}

    THE SECTION:
      kind: {section_kind}   gat role: {form_role}
      creative intent: {section_intent}
      the SEAM into the next section (the composers designed this handoff — shape your
      final notes to serve it): {section_transition}
      length: compose WITHIN about {window_beats} beats{phrase_room}. Do not fill time merely because it
      is there — a held note and a deliberate silence are part of the phrase, not a gap in it.

    TALA POSITION — LAND ON THE SAM: {tala_position}

    THE GAT HEAD YOU ORBIT — the intro TEASES it; the manjha and any taan fill must flow back
    INTO it:
    {mukhada_head}

    WHAT YOU ALREADY PLAYED (the lead's memory of the piece so far — each note is
    swara(octave)/bol~meend-target:beats, the octave/bol/meend only where present; -:2 is a
    two-beat rest):
    {previous}

    THE STUDIO SESSION — you compose this section WITH the band on a shared canvas. Your move
    now is: {move}. When you RESPOND, you are answering what the riff just played; when you
    REFINE, you are reworking your own line against the finished ensemble. Read the canvas:
    {canvas}

    GAT STRUCTURE CHECK (verified cells — mukhada / intro / manjha / taan fill):
    {repair}

    {hearing}

    Based on everything above, compose this ONE section now — the phrase_plan first, then
    the notes that realise it.
  expected_output: |
    A single LeadPhrase as JSON and nothing else — no prose, no code fences — in the shape shown
    under THE OUTPUT SHAPE.

# The INTRO task (2026-10-20, GPT's prompt review, verified in trace a8b711f667eb): the alap used to be
# composed inside generate_lead, which also told it to LAND ON THE SAM at 0/16/32/48, to develop the
# song's seed, that craft "never" rejects (its call-and-answer and jod checks do), and carried the
# studio canvas. Same agent, same LeadPhrase; only the instructions an alap needs, with each rule's
# status stated the way crew/gat_verifier.py:check_intro applies it.
generate_intro:
  description: |
    You are the Lead — the raga's melodic voice in the Hindustani tradition — and you are opening
    the piece: an unmetred ALAP, then (when the length line says so) a short JOD whose pulse walks
    the band in, then a held Sa and a breath before the gat. Compose this ONE intro. Emit notes as
    swaras with DURATIONS (no start times — the arrangement places your line and seats it in your
    register).

    METHOD: fill `phrase_plan` FIRST — in `badhat_plan` name each phrase's JOB (establish, call,
    answer, call from further away, close), the swara it DWELLS on, and the swara it ENDS on
    before its silence — then write `notes` that realise exactly that. A held tension note INSIDE
    a phrase is not the same as ending on it: the checker reads where each phrase ENDS.

    THE SHAPE, PHASE BY PHASE:
    {role_brief}

    THE PHASES IN TIME — the length line is authoritative:
      length: compose WITHIN about {window_beats} beats{phrase_room}.
      - THE ALAP has no sam to land on and no measure to fill: the beat numbers are only timing
        coordinates for holds measured in seconds. Breathe; vary the lengths.
      - THE JOD (when there is one) starts exactly on its beat; from there every phrase starts at
        the start of a vibhag and every note of a beat or longer starts on a beat.
      - THE HANDOFF: close on a held Sa; code reserves the breath before the gat. Ending before the
        window does is fine — a rest counts as composed time, and a shorter alap is never a fault.

    THE HANDOFF TO THE GAT — authoritative (if the section's seam text below names a different
    note, follow THIS):
    {handoff}

    WHICH RULES DO WHAT:
      REJECTED and sent back to you (hard):
        - every swara (each note, each grace, each meend target) is one of the raga's allowed
          swaras below, in its legal direction; every note has a positive duration;
        - the intro stays inside its window;
        - CALL AND ANSWER: with three or more phrases, at least one CALL (a phrase that ends off the
          raga's main resting swaras, on tension) comes before the close; no phrase ends on a swara
          the raga avoids resting on; a phrase that ends on a main resting swara arrives the way
          the raga allows, and before the close it FALLS or TURNS onto it — climbing into it is a
          call stopping on a rest (Sa is the exception: home may be reached from either side);
        - with a jod: its first note strikes ON the jod's beat, its phrases start on a vibhag, and
          its notes of a beat or longer start on a beat.
      REPORTED back to you, not rejected (the default shape — follow it unless the music says
      otherwise): answers resolve onto a main resting swara; the alap is mostly held notes measured
      in seconds; it opens around Sa, touches the register the raga lives in, returns to Sa, has
      real silences, opens one new swara at a time, and closes on its longest Sa; it prepares the
      gat's first swara and never quotes the head's tune.

    THE OUTPUT SHAPE — return a single LeadPhrase as JSON in exactly this shape:
    {output_schema}

    THE RAGA — use ONLY these swaras; its pakad, chalan, resting swaras and register are your
    material (the intro's seed comes from its pakad or chalan):
    {raga_block}

    Tempo: {bpm} bpm. Your octaves: 0 is home (madhya), -1 the lower (mandra), +1 the upper (taar).

    WHAT THE USER ASKED FOR (verbatim — honour what it asks of the opening):
    {user_request}

    THE SECTION: creative intent: {section_intent}
      the seam into the gat (the composers' words): {section_transition}

    YOUR PREVIOUS ATTEMPT AND WHAT FAILED (empty on the first attempt):
    {repair}

    {hearing}

    Based on everything above, compose the intro now — the phrase_plan first, then the notes.
  expected_output: |
    A single LeadPhrase as JSON and nothing else — no prose, no code fences — in the shape shown
    under THE OUTPUT SHAPE.

# The TAAN task (2026-10-20, GPT's prompt review): the developed taan used to be composed inside
# generate_lead, which asked for true rests, fast runs that "arrive on a held note", compound strokes
# (dir, dadir) and a window to compose "within" — while its brief and check_taan demand a continuous
# run, one stroke per note and an exact fill. Same agent, same LeadPhrase; only the taan's contract,
# each rule's status stated the way crew/gat_verifier.py:check_taan applies it.
generate_taan:
  description: |
    You are the Lead — the raga's melodic voice in the Hindustani tradition — and this is the
    piece's climax: the long TAAN, one continuous run from its first note to the sam, grown from
    the piece's motif. Compose this ONE taan. Emit notes as swaras with DURATIONS (no start times).

    METHOD: fill `phrase_plan` FIRST — the style, the register arc and the run's phrases
    (`taan_phrases`, each with its one pulse and the swara it reaches) — then write `notes` that
    run exactly at those pulses through those phrases.

    THE TAAN:
    {role_brief}

    THE WINDOW AND THE ARRIVAL — authoritative:
      length: {window_beats} beats{phrase_room}.
      the section, with its destination: {section_intent}
      THE HEAD YOU RUN INTO (it re-enters on the sam right after you):
    {mukhada_head}

    WHICH RULES DO WHAT:
      REJECTED and sent back to you (hard):
        - every swara (each note, each grace, each gamak partner) is one of the raga's allowed
          swaras, in its legal direction, and no long straight scale run;
        - the notes fill the window EXACTLY, with no rest anywhere — not at the end either;
        - the plan's phrases sum to the window, start at chaugun, never slow down, put ONE climax
          phrase in the later half (its highest note past 60% of the taan) and end with a short
          cadence at the same pulse; every note runs at its phrase's pulse (only a phrase's last
          note, up to a beat, or a gamak note may ring longer), no note crosses a phrase boundary,
          no leap wider than a fifth inside a phrase, and every note is ONE stroke (da or ra);
        - the peak does not arrive early;
        - the arrival: with a returning head, your last note is a step into its first swara on
          the sam; without one, you end on a resting swara (Sa, the vadi or the samvadi).
      REPORTED back to you, not rejected: the taan grows from the motif ({motif}); the arc opens
      in the madhya, enters the taar and comes down after the peak; ornaments stay sparing at speed.

    THE OUTPUT SHAPE — return a single LeadPhrase as JSON in exactly this shape:
    {output_schema}

    THE RAGA — use ONLY these swaras; its pakad and chalan are the taan's raw material:
    {raga_block}

    Tempo: {bpm} bpm. Your octaves: 0 is home (madhya), -1 the lower (mandra), +1 the upper (taar).

    WHAT THE USER ASKED FOR (verbatim — honour what it asks of the climax):
    {user_request}

    WHAT YOU ALREADY PLAYED (the lead's memory of the piece so far — each note is
    swara(octave)/bol~meend-target:beats; -:2 is a two-beat rest):
    {previous}

    YOUR PREVIOUS ATTEMPT AND WHAT FAILED (empty on the first attempt):
    {repair}

    {hearing}

    Based on everything above, compose the taan now — the phrase_plan first, then the notes.
  expected_output: |
    A single LeadPhrase as JSON and nothing else — no prose, no code fences — in the shape shown
