# Per-call briefs for the Lead generator — exactly ONE of these is injected as
# {role_brief} per generation (crew/lead.py::_render_role_brief), so a call reads only
# the rules for the section it is actually composing. This replaced the old universal
# prompt that taught every gat role + section kind on every call (2026-07-16 latency
# campaign): the model deliberates over what applies, so irrelevant rules cost thinking
# tokens, not just context.
#
# Selection: a section with a known gat `form_role` gets that role's brief (the role
# subsumes the kind); otherwise its section `kind`'s brief; otherwise `default`.
# Every HARD rule a gat verifier enforces (crew/gat_verifier.py) MUST stay stated here —
# a trimmed hard rule just turns into re-roll spend. Craft guidance is reported, never re-rolled.

kinds:
  alaap: |
    An ALAAP: slow, unmetered, spacious. Unfold the seed from the mandra upward — long
    notes with an occasional meend, and true rests between phrases. No hurry.
  melody: |
    A MELODY: a singable theme. State the seed clearly, answer it (A, then a varied A',
    a contrasting B, then A''), and keep a medium pace — but not an even one: a quick
    figure of a beat or two, then a note left to ring.
  taan: |
    A TAAN: fast, virtuosic and CONTINUOUS. Develop the seed with sequences and
    fragments at chaugun (0.25 notes) from the first note to the last, no rests or
    holds inside the run; climb to ONE
    peak in the taar late, and run the closing phrase onto the sam. Never a straight
    aroha/avaroha run.
  solo: |
    A SOLO: improvise on the seed — alternate held statements with quick developed runs.
  outro: |
    An OUTRO: take the seed one last time and resolve it down to a held Sa. A tihai
    (one phrase stated THREE times, the last landing on the sam) is the classic close.

roles:
  mukhada: |
    The MUKHADA — the GAT HOOK. Write EXACTLY ONE avartan; code loops it across the
    section and brings it back VERBATIM on every return (you never restate or vary it
    yourself):
      - LET THE RAGA SHAPE IT: the pakad and chalan are your material — quote, vary or
        only allude to them; the idea itself is yours.
      - CHOOSE THE SAM NOTE DELIBERATELY: your FIRST note sounds ON the sam every single
        avartan, struck with a strong "da". It does NOT have to be Sa — real gats land the
        sam on whichever swara the phrase makes strong (a Vilayat Khan Yaman gat lands on
        Pa, one Bageshree bandish on Re, another Bageshree gat on Ma). What matters is that
        it feels like an ARRIVAL the phrase has earned, not a note the line happened to
        reach.
      - Fill the whole avartan and LAND: resolve the last note onto a resting swara
        (ideally the vadi or Sa).
      - LOOP SEAMLESSLY: write the LAST note to lead melodically into the FIRST, so
        each repeat feels like it lands rather than restarts. End on a driving APPROACH
        that surges into the next sam — the stroke frame says where it begins (matras
        12-16 in a Masitkhani gat) — this is what a listener hums.
      - PLAN THE RIGHT HAND FIRST (phrase_plan.stroke_line — THE STROKE FRAME below): on a
        sitar the rhythm IS the strokes. Choose how many strokes each matra holds and where
        a note rings on ("-"), using the whole range — quick figures, single strokes, held
        notes. Clap the stroke line alone and it should still be recognisably this head.
        Then write the notes that play it, every note carrying the bol its matra asks for.
      - ONE IDEA, ONE BREATH — PLAN ITS SHAPE (phrase_plan.head_shape) with the stroke line:
        the whole avartan is ONE continuous sentence, never a few equal cells joined end to
        end. A quick FIGURE builds anticipation (a matra or two, often several swaras on ONE
        stroke via a note's "grace" list); a held BREATHER fulfils it — one swara struck once
        and left to ring at least two beats ("-" in the stroke line), the natural home for the
        raga's own andolan or meend; a RESPONSE may develop the figure; the APPROACH resolves
        it into the sam. The breather grows out of the figure. No rest and no chikari anywhere
        inside the head: where you want air, HOLD a note instead.
      - OPEN WITH THE RAGA, NOT THE SCALE: the first four or five swaras should be a phrase
        only this raga plays (from its pakad or chalan), never a straight climb or fall
        along the scale. A head that would still be recognisable played slowly, plain, with
        no accompaniment is the goal.
      - GAMAK, USED WISELY: a gamak ("gamak_with", swinging hard against its neighbour while
        the right hand keeps striking) is an EVENT in a head — one or two at most, on the
        notes the phrase leans on. A master's Darbari gat OPENS on one (Sa, then Ma swung
        onto Ga). Give those matras strokes in the stroke_line; the gamak re-strikes. A
        gamak on every note is a texture, not a gat, and the breather rings without one.
      - KEEP IT SIMPLE: the head is the simplest, most memorable thing in the piece, not a
        demonstration of the raga — a few swaras used beautifully beat a cycle that tries to
        show everything the raga can do.
      - LET THE SAM RE-ENTER: cadence to a DIFFERENT note than the one you open on. A head
        that ends on its own opening note merges with itself across the loop, and the
        downbeat disappears.
  manjha: |
    The MANJHA — the LOWER-REGISTER BRIDGE (part of the sthayi; calm):
      - ONE clear, spacious idea filling the whole window (code keeps a short breath after
        it) — longer nyas, meend and breathing room, never a busy taan-like run.
      - Centre of gravity in the mandra / lower-madhya: DIP into the mandra (oct -1)
        and do NOT touch the taar — the antara owns the upper octave.
      - Vary the note lengths (a flat wall of equal durations reads as a drone).
      - Keep the head's rhythmic skeleton recognisable but CONTRAST it by register and
        contour (dip down, then settle) rather than repeating it.
      - The mukhada re-enters right after you: shape your FINAL notes as a stepwise
        lead-in that flows into the head's first swara.
  antara: |
    The ANTARA — the SECOND MOVEMENT of the SAME gat, never a new tune. In order:
      - OPEN in the middle (madhya) octave by QUOTING the mukhada's opening swaras
        (restate or vary lightly; never open in the taar).
      - DEVELOP that material through sequential variations, climbing gradually — a
        good third of your material recognisably derived from the head.
      - Enter the taar (+1) and reach the composition's HIGHEST note ONCE, past the
        midpoint — the emotional peak; then DESCEND (never end on the peak).
      - Come to REST on or near madhya Sa, handing off into the returning mukhada.
      - Fill the window, pacing close to the mukhada's, and MIX at least three distinct
        note values (8ths and quarters against the held notes) — a wall of even long
        notes reads as a drone.
      - BREATHE between bursts: a quick figure of a matra or two (several swaras on one
        stroke via a "grace" list is idiomatic), then a held note before the next.
  taan_short: |
    A TAAN FILL — a short burst spliced into the FRONT of the mukhada's avartan, the
    way the tradition improvises: YOU launch from the sam and run the open region;
    then the head's own APPROACH re-enters after you and lands the next sam.
      - SIXTEENTH-NOTES only (dur 0.25); only the final landing note may be longer.
      - Fill the cut window exactly — the head re-enters the instant you finish.
      - Resolve stepwise into the RE-ENTERING approach's first swara (the section
        intent names it). A connective flourish, not a solo.
  taan_long: |
    The TAAN — THE CLIMAX of the whole composition. A taan is ONE musical journey grown
    from the piece's MOTIF, not "the scale, quickly":
      - Restate the motif EARLY, then develop that one idea — sequence, fragment,
        compress; never unrelated fast phrases.
      - Choose ONE dominant style for the whole taan (phrase_plan.taan_style): koot
        (vakra zig-zag along the raga's own chalan — the DEFAULT, deeply raga-true);
        gamak (cells written with "gamak_with", swung with force against a neighbour,
        moving from pair to pair — a natural metal fit); alankarik
        (sequenced palta patterns at speed); chhoot (a swift dashing descent from the
        taar after the peak); sapat (a straight run — ONE dash, never the whole taan);
        or mishra (sapat and koot mixed).
      - A TAAN FLOWS. Plan it as phrases first (phrase_plan.taan_phrases): it launches
        STRAIGHT at chaugun (4 notes per matra, every note 0.25) from its first note —
        no slower warm-up — and every phrase keeps ONE pulse; near the climax a phrase
        may quicken to chhagun (6 per matra) at its boundary, never slower. No rests, and no long note inside a
        run: the only notes allowed to ring longer are a phrase's LAST note (an arrival,
        up to a beat) and a gamak note. A fast cluster followed by a held note, again and
        again, is stop-start, not a taan.
      - THE ARC is badhat (phrase_plan.register_plan + each phrase's reach): a statement
        of the motif in the madhya, builds that widen the range at that pulse,
        ONE climax phrase in the later half that CLIMBS to the single highest note near
        its END (past 60% of the taan), then a SHORT cadence (a quarter of the taan at
        most) that keeps that pulse into the sam — not a long cascade down. Register
        changes across phrases, never by a jump inside one.
      - Every note is ONE mizrab stroke: alternate da and ra. A compound bol (dir, dara)
        splits its note into faster strokes and breaks the pulse.
      - END IN FLIGHT, INTO THE DESTINATION: after the peak, a short approach runs
        straight into the next sam. When the section intent names a DESTINATION (the
        returning mukhada's first swara), that swara on the sam IS your resolution —
        your last note is a step into it, and the line runs right up to the sam with no
        rest. Do not end with a phrase repeated three times; no tihai is added. A
        brilliant, continuous arrival matters more than maximum speed.
  intro: |
    The ALAP, THEN A SHORT JOD — the way a sitar performance opens. The alap makes THIS raga
    unmistakable, unhurried and unmetred; then the jod's pulse walks the band in. One musical
    argument the gat will answer, not a scale, not a demonstration, and not a preview of the
    gat's tune. The length line says where the jod enters.
    THE ALAP (beat 0 up to the jod's beat) BREATHES INSTEAD OF COUNTING. It is mostly HELD notes,
    measured in SECONDS (the length line converts them to beats at this tempo), with rests a
    breath long between phrases. Vary the lengths — 3, 5.5, 2.5 — so nothing falls into a beat.
    Take your time; do not make it busy.
    EACH PHRASE STANDS ON ONE HELD SWARA, held for seconds. Its other notes approach and decorate
    that swara the raga's way (its kan, its turns) and pass in quick steps. Each phrase starts back
    inside the ground already opened.
    IT IS A CONVERSATION — CALL AND ANSWER. A call reaches out and pauses, unresolved; the answer
    brings it home. Tension is built and then released, again and again, each time from further
    away. PLAN IT FIRST — phrase_plan.badhat_plan names each phrase's JOB and the swara it stands
    on (3-5 phrases; fewer if the length line says so):
      1. ESTABLISH — sustain Sa; touch a little above and come back, a little below (in the
         register the raga lives in — raga facts: register) and come back: home first.
      2. CALL — bring in the raga's signature as the raga treats it: its characteristic swara
         approached the raga's way (its kan), turned the way the pakad/chalan turn. A call does
         NOT rest: its held swara STOPS SHORT of the raga's main resting swaras (the first ones
         the raga facts' nyas line names) — a held andolit swara (code sways it), or a swara that
         pulls onward. Answers rest on those main nyas; a call stops on purpose somewhere else.
      3. ANSWER — resolve that tension onto a main nyas, the raga's way: through its own
         cadence, FALLING or TURNING onto the resting swara (g m R lands on Re; m P g m R S
         lands on Sa), never climbing into it. Any nyas may answer; Sa is the deepest home.
      4. CALL, FROM FURTHER AWAY — ONE new frontier: reach one swara past the ground opened so
         far and hold it. Do not open several new swaras in one phrase.
    Tension can PILE UP before it is released: a longer call, or two or three calls in a row
    each reaching one swara further, make the answer land harder. Shape the calls and answers
    the way the music wants — the plan above is the usual course, not a fixed count.
    THE ARC FOLLOWS THE RAGA'S REGISTER: a raga that lives in the mandra reaches DOWN at its
    widest — mandra Dha, Pa — and leaves the taar alone; a raga that lives high climbs into the
    taar. The widest reach comes about three quarters of the way through the alap; the way back
    is shorter.
    THE JOD (from its beat to the end): now the pulse arrives — the band is about to enter. Its
    first note strikes exactly ON the jod's beat (let a rest carry the alap up to it). It walks on
    a steady pulse: every phrase starts at the START OF A VIBHAG (the tala's own measure — in
    teentaal every 4 beats), every note of a beat or longer starts ON a beat, half-beat notes are
    passing steps, and a long swara is re-struck on the pulse (da, ra, da) rather than sustained
    past two beats. The jod is the LEAD IN: it PREPARES the gat — it rests on the swara the head
    enters on and the swaras the head stands on (the handoff names them) and turns through the
    raga's cadence onto a HELD Sa (2-4 beats). It never plays the head's tune: the gat's entry
    should be news the alap made ready.
    If the length line says there is no jod, the whole intro is the alap, closing on the held Sa.
    THE MOTIF: phrase_plan.seed is 2-5 swaras from the raga's pakad or chalan; the phrases
    develop it.
    Chikari rare and SHORT (0.25-0.5): a struck string in an empty matra, never a held tone.
    ORNAMENT IS SLOW HERE: kan, a meend gliding INTO a landing (sparingly — a meend is heard at
    its target), and the sway code gives an andolit swara you hold. No gamak cells in the alap;
    they belong to the gat. Each note is a single stroke (da / ra).
    Stay inside the window; an alap SHORTER than the window is fine (code lets the closing Sa
    ring into the breath before the gat).
  amad: |
    The AMAD — the FOURTH line of the gat (Parikh: it "brings you down to the point
    where the composition started"), riding the antara's final avartan:
      - OPEN where the antara landed (on or within a step of its last swara) and
        DESCEND — one composed line, down through the madhya, in ONE avartan.
      - Direction is DOWN: never climb above your opening (the peak was the antara's);
        the line may eddy a step, never re-peak.
      - END at or below madhya as a stepwise LEAD-IN to the returning head's first
        swara, arriving at the closing sam — the mukhada re-enters the moment you land.
      - PHRASE the descent: mix note values (a meend into a landing is idiomatic);
        an even wall of notes flattens the descent.
  outro: |
    The OUTRO: settle onto a held Sa. A tihai — one phrase stated THREE times, the
    last landing on the sam — is the classic close.
  tihai: |
    A TIHAI — the cadence. Write ONE short phrase (2-6 notes) that resolves onto Sa or
    the vadi, and state it THREE times, identical, with the same short silence after the
    first two. Code places the three so the third phrase's LAST note strikes the next
    sam; write that last note plainly — do not stretch it to fill the section.

default: |
  A free section: shape the phrase to the section's creative intent and its seam into
  the next section, developing the piece's motif.
