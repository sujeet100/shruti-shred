# Per-call briefs for the Lead generator — exactly ONE of these is injected as
# {role_brief} per generation (crew/lead.py::_render_role_brief), so a call reads only
# the rules for the section it is actually composing. This replaced the old universal
# prompt that taught every gat role + section kind on every call (2026-07-16 latency
# campaign): the model deliberates over what applies, so irrelevant rules cost thinking
# tokens, not just context.
#
# Selection: a section with a known gat `form_role` gets that role's brief (the role
# subsumes the kind); otherwise its section `kind`'s brief; otherwise `default`.
# Every rule a gat verifier enforces (crew/gat_verifier.py) MUST stay stated here —
# a trimmed rule the verifier still checks just turns into re-roll spend.

kinds:
  alaap: |
    An ALAAP: slow, unmetered, spacious. Unfold the seed from the mandra upward — long
    notes with an occasional meend, and true rests between phrases. No hurry.
  melody: |
    A MELODY: a singable theme. State the seed clearly, answer it (A, then a varied A',
    a contrasting B, then A''), and keep a medium pace.
  taan: |
    A TAAN: fast and virtuosic. Develop the seed with sequences and fragments,
    accelerate by mixing triplets and shorter values (never one even duration), climb
    to ONE peak in the taar, and land the closing phrase on the sam. Never a straight
    aroha/avaroha run.
  solo: |
    A SOLO: improvise on the seed — alternate held statements with quick developed runs.
  outro: |
    An OUTRO: take the seed one last time and resolve it down to a held Sa. A tihai
    (one phrase stated THREE times, the last landing on the sam) is the classic close.

roles:
  mukhada: |
    The MUKHADA — the GAT HOOK. Write EXACTLY ONE avartan; code loops it across the
    section and brings it back VERBATIM on every return (you never restate or vary it
    yourself), so pour everything into this single cycle:
      - BUILD IT ON THE PAKAD — the raga's signature phrase IS the natural hook; quote
        or closely derive the head from it.
      - OPEN ON THE SAM'S SWARA: your FIRST note sounds ON the sam every single avartan
        — make it Sa or the vadi (ideally the pakad's strong landing), struck with a
        strong "da". A weak or stray swara on the sam is rejected.
      - Fill the whole avartan and LAND: resolve the last note onto a resting swara
        (ideally the vadi or Sa).
      - LOOP SEAMLESSLY: write the LAST note to lead melodically into the FIRST, so
        each repeat feels like it lands rather than restarts. The final ~5 matras are
        the head's APPROACH — the anacrusis that surges into the next sam; make them
        the most driving part of the cycle (this is what a listener hums).
      - MIX THE NOTE VALUES — at least THREE distinct durations: 8ths (0.5) for the
        movement, quarters, and at least one HELD note (2+ beats) as the nyas resting
        point. A head of even values reads as a metronome and is rejected.
      - FOLLOW THE STROKE FRAME (given below): the bol pattern is the gat's IDENTITY —
        strike the sam "da", place the dir doublings where the frame asks (two fast
        notes, or one note with bol "diri"), and give most notes an explicit da/ra. A
        head without a stroke signature is rejected.
  manjha: |
    The MANJHA — the LOWER-REGISTER BRIDGE (part of the sthayi; short and calm):
      - ONE clear, spacious idea filling the window (about one avartan) — longer nyas,
        meend and breathing room, never a busy taan-like run.
      - Centre of gravity in the mandra / lower-madhya: DIP into the mandra (oct -1)
        and do NOT touch the taar — the antara owns the upper octave.
      - Vary the note lengths (a flat wall of equal durations is rejected).
      - Keep the head's rhythmic skeleton recognisable but CONTRAST it by register and
        contour (dip down, then settle) rather than repeating it.
      - The mukhada re-enters right after you: shape your FINAL notes as a stepwise
        lead-in that flows into the head's first swara.
  antara: |
    The ANTARA — the SECOND MOVEMENT of the SAME gat, never a new tune. In order:
      - OPEN in the middle (madhya) octave by QUOTING the mukhada's opening swaras
        (restate or vary lightly; never open in the taar).
      - DEVELOP that material through sequential variations, climbing gradually — a
        good third of your material recognisably derived from the head.
      - Enter the taar (+1) and reach the composition's HIGHEST note ONCE, past the
        midpoint — the emotional peak; then DESCEND (never end on the peak).
      - Come to REST on or near madhya Sa, handing off into the returning mukhada.
      - Fill the window, pacing close to the mukhada's, and MIX at least three distinct
        note values (8ths and quarters against the held notes) — a wall of even long
        notes reads as a drone and is rejected.
  taan_short: |
    A TAAN FILL — a short burst spliced into the FRONT of the mukhada's avartan, the
    way the tradition improvises: YOU launch from the sam and run the open region;
    then the head's own APPROACH re-enters after you and lands the next sam.
      - SIXTEENTH-NOTES only (dur 0.25); only the final landing note may be longer.
      - Fill the cut window exactly — the head re-enters the instant you finish.
      - Resolve stepwise into the RE-ENTERING approach's first swara (the section
        intent names it). A connective flourish, not a solo.
  taan_long: |
    The TAAN — THE CLIMAX of the whole composition. A taan is ONE musical journey grown
    from the piece's MOTIF, not "the scale, quickly":
      - Restate the motif EARLY, then develop that one idea — sequence, fragment,
        compress; never unrelated fast phrases.
      - Choose ONE dominant style for the whole taan (phrase_plan.taan_style): koot
        (vakra zig-zag along the raga's own chalan — the DEFAULT, deeply raga-true);
        gamak (every note shaken with force — a natural metal fit); alankarik
        (sequenced palta patterns at speed); chhoot (a swift dashing descent from the
        taar after the peak); sapat (a straight run — ONE dash, never the whole taan);
        or mishra (sapat and koot mixed).
      - THE ARC is badhat (phrase_plan.register_plan): start in the madhya (not the
        taar), widen the range gradually, reach the single highest note ONCE past the
        midpoint, then descend purposefully.
      - THE RHYTHM is burst and space (phrase_plan.rhythm_plan): a pickup, a sixteenth
        burst (4+ consecutive 0.25s), a held nyas or a true rest, a bigger burst —
        vary the notes-per-beat (layakari), with at least three distinct durations. At
        the fastest passages think like a sitarist's TODA: articulate with diri/darada
        bols rather than more notes.
      - END IN FLIGHT: the final approach is itself a dense sixteenth run resolving
        STRAIGHT onto the closing sam, landing on a resting swara — a landing walked to
        on long notes is rejected. Make the closing phrase SHORT and conclusive: code
        restates it as a TIHAI (your closing phrase three times, the last landing
        exactly on the sam — the gharana's signature cadence). A brilliant landing
        matters more than maximum speed.
  intro: |
    The AOCHAR — a SHORT ALAP VISTAR developing ONE MUSICAL THOUGHT. Make THIS raga
    unmistakable, keep the TENSION alive over a plucked low Sa, and TEASE the gat so
    the mukhada arrives as the natural culmination of your idea:
      - MOTIF FIRST: phrase_plan.seed is 2-5 swaras DERIVED FROM THE MUKHADA HEAD
        shown below (a fragment of the head's swaras is ideal; fall back to a pakad
        fragment when no head is shown). Every phrase answers "how do I develop this
        motif?" — never "what new phrase should I invent?". Describe the reveal in
        phrase_plan.badhat_plan.
      - Compose 3-6 SHORT phrases separated by real silence. Each phrase explores or
        varies the motif and HOLDS ITS TENSION: do not resolve a phrase onto Sa; no
        homecoming until the very end.
      - EVERY PHRASE ENTERS ON A MEASURE'S FIRST BEAT — the start of a vibhag, the tala's
        own bar — and the silence after it runs as long as it needs to. A phrase that
        begins on the downbeat and then leaves the rest of the bar empty creates
        anticipation: the listener waits for the next entry. A phrase that begins wherever
        the last one happened to stop sounds unmoored. (Code snaps your phrase STARTS to
        that grid; write whole phrases and let them breathe.)
      - SILENCE IS ABOUT A QUARTER OF THE ALAP, not a rest or two dropped in to satisfy a
        rule. Write rests of 1-4 beats between phrases; the space is the music.
      - HOME IS STRUCK, NOT SUSTAINED: a jod string sounds a low Sa in the gaps your
        phrases leave — code places it, in time, where you rest. So do NOT re-pluck a low
        mandra Sa yourself between phrases; leave the space and the jod will speak into
        it. Keep chikari rare, and SHORT (0.25-0.5) — it is a struck string filling an
        empty matra, never a held tone.
      - RHYTHM HAS CONTRAST. A stream of notes all 1-2 beats long reads as a machine
        pacing itself. Let a phrase settle onto a genuinely long landing, and let another
        move in quick 0.25-0.5 steps — the alap breathes irregularly, by design.
      - BADHAT (progressive reveal): phrase 1 states only a FRAGMENT of the motif (2-3
        swaras) in a NARROW range around home; each later phrase GROWS OUT OF THE ONE
        BEFORE IT — restating it, extending it a note further, or answering it — never a
        fresh idea because a new phrase began. Present the FULL motif at the intro's
        widest reach; the intro's highest note arrives PAST THE MIDPOINT.
      - THE ARC IS AN OCTAVE JOURNEY: the phrases climb, reaching into the TAAR (upper)
        octave at the widest point, and then either descend home for the close or stay up
        and resolve on the taar Sa. Both endings are idiomatic — choose one deliberately
        rather than drifting to a stop.
      - STATE THE RAGA: build the phrases from the pakad and chalan (the motif quoted,
        then varied); at least one phrase must STATE THE PAKAD outright.
      - OPEN on or around madhya Sa (never the taar) and let the melodic line itself
        DIP INTO THE MANDRA in the early phrases over the ringing jod.
      - Meend SPARINGLY: a meend note is heard at its TARGET, so save it for a glide
        INTO a landing; most alap notes sound their own written swara plain.
      - ONLY the FINAL phrase RESOLVES: come home to a HELD Sa (2-4 beats — long enough
        that it finally feels like home, never so long that one note becomes the alap);
        code then lets it ring into a reserved silence before the gat enters. Do not
        stretch the last note to fill whatever window is left.
  amad: |
    The AMAD — the FOURTH line of the gat (Parikh: it "brings you down to the point
    where the composition started"), riding the antara's final avartan:
      - OPEN where the antara landed (on or within a step of its last swara) and
        DESCEND — one composed line, down through the madhya, in ONE avartan.
      - Direction is DOWN: never climb above your opening (the peak was the antara's);
        the line may eddy a step, never re-peak.
      - END at or below madhya as a stepwise LEAD-IN to the returning head's first
        swara, arriving at the closing sam — the mukhada re-enters the moment you land.
      - PHRASE the descent: mix note values (a meend into a landing is idiomatic);
        an even wall of notes is rejected.
  outro: |
    The OUTRO: settle onto a held Sa. A tihai — one phrase stated THREE times, the
    last landing on the sam — is the classic close.

default: |
  A free section: shape the phrase to the section's creative intent and its seam into
  the next section, developing the piece's motif.
